<style>
  /* ── Column width constraints (edit here) ── */
  :root { --col-min-width: 150px; --col-image-min-width: 150px; --col-table-min-width: 900px; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; font-family: Arial, sans-serif; font-size: 14px; color: #333; background: #fff; }

  /* ── List view ── */
  #view-list { height: 100%; display: flex; flex-direction: column; padding: 12px; }
  #loading { padding: 40px; text-align: center; color: #888; }
  #error-msg { padding: 16px; color: #c62828; background: #ffebee; border-radius: 4px; margin-bottom: 12px; flex-shrink: 0; }
  #table-wrapper { flex: 1; overflow: scroll; }

  #data-table { width: 100%; border-collapse: collapse; }
  #data-table th, #data-table td {
    border: 1px solid #ddd; padding: 6px 10px; text-align: left; vertical-align: middle;
  }
  .cell-content {
    min-width: var(--col-min-width);
    white-space: normal; word-break: break-word;
  }
  .cell-content--image { min-width: var(--col-image-min-width); }
  .cell-content--table { min-width: var(--col-table-min-width); max-width: none; }

  .mini-table { border-collapse: collapse; width: 100%; font-size: 12px; }
  .mini-table th, .mini-table td { border: 1px solid #e0e0e0; padding: 2px 6px; text-align: left; white-space: normal; word-break: break-word; }
  .mini-table thead th { background: #f0f0f0; font-weight: 600; color: #555; }

  .table-editor { width: 100%; overflow-x: auto; margin-top: 8px; }
  .table-editor table { border-collapse: collapse; width: 100%; font-size: 13px; }
  .table-editor th, .table-editor td { border: 1px solid #ddd; padding: 4px 6px; }
  .table-editor thead th { background: #f5f5f5; font-weight: 600; font-size: 12px; color: #555; white-space: nowrap; }
  .table-editor td:last-child { width: 28px; text-align: center; }
  .table-editor input[type="text"] {
    width: 100%; min-width: 80px; padding: 4px 6px; border: 1px solid #ccc;
    border-radius: 3px; font-size: 13px; outline: none; box-sizing: border-box;
  }
  .table-editor input[type="text"]:focus { border-color: #4285f4; box-shadow: 0 0 0 2px rgba(66,133,244,0.2); }
  .btn-delete-row { background: none; border: none; cursor: pointer; color: #c62828; font-size: 16px; padding: 0 4px; }
  .btn-delete-row:hover { color: #b71c1c; }
  .btn-add-row { margin-top: 6px; background: none; border: 1px solid #4285f4; color: #4285f4; border-radius: 4px; padding: 4px 12px; cursor: pointer; font-size: 13px; display: block; }
  .btn-add-row:hover { background: #e8f0fe; }

  #toolbar { flex-shrink: 0; padding: 0 0 8px; display: flex; align-items: center; justify-content: space-between; }
  #toolbar-right { display: flex; align-items: center; gap: 8px; }
  #col-toggle-wrap { position: relative; display: inline-block; }
  #regex-label { font-size: 13px; color: #555; cursor: pointer; display: flex; align-items: center; gap: 4px; user-select: none; }
  #btn-columns, #btn-add-person {
    background: none; border: 1px solid #ccc; border-radius: 4px;
    padding: 5px 12px; cursor: pointer; font-size: 13px; color: #555;
  }
  #btn-columns:hover, #btn-add-person:hover { background: #f5f5f5; }
  #col-panel {
    position: absolute; top: calc(100% + 4px); right: 0; z-index: 100;
    background: #fff; border: 1px solid #ddd; border-radius: 4px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    padding: 8px 12px; min-width: 180px; max-height: 300px; overflow-y: auto;
  }
  #col-panel label {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 0; cursor: pointer; font-size: 13px; white-space: nowrap;
  }

  #data-table thead th { background: #f5f5f5; font-weight: 600; position: sticky; top: 0; z-index: 1; }
  #data-table tbody tr:nth-child(even) { background: #fafafa; }
  #data-table tbody tr:hover { background: #e8f0fe; }
  #filter-row th { padding: 4px 6px; }
  #filter-row input[type=text] {
    width: 100%; padding: 4px 6px; border: 1px solid #ccc; border-radius: 3px;
    font-size: 13px; outline: none;
  }
  #filter-row input[type=text]:focus { border-color: #4285f4; }
  .empty-filter-label {
    display: flex; align-items: center; gap: 5px;
    font-size: 13px; color: #555; cursor: pointer; user-select: none; white-space: nowrap;
  }

  .name-link { color: #1a73e8; text-decoration: none; cursor: pointer; }
  .name-link:hover { text-decoration: underline; }

  .thumb { width: 100%; height: auto; border-radius: 4px; cursor: pointer; display: block; }
  .thumb:not([src]), .thumb[src=""] { background: #f0f0f0; min-height: 48px; cursor: default; }
  .no-image { color: #bbb; font-style: italic; }

  /* ── Lightbox ── */
  #lightbox {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.82); display: flex;
    align-items: center; justify-content: center; z-index: 9999; cursor: pointer;
  }
  #lightbox img {
    max-width: 90vw; max-height: 90vh; border-radius: 8px;
    box-shadow: 0 4px 32px rgba(0,0,0,0.5);
  }

  /* ── Edit view ── */
  #view-edit { height: 100%; overflow-y: scroll; padding: 16px; }
  #edit-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  #btn-back {
    background: none; border: 1px solid #ccc; border-radius: 4px;
    padding: 6px 14px; cursor: pointer; font-size: 14px; color: #555;
  }
  #btn-back:hover { background: #f5f5f5; }
  #edit-title { font-size: 18px; font-weight: 600; }

  .field-block { margin-bottom: 16px; }
  .field-block label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 13px; color: #555; }
  .field-block input[type="text"] {
    width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px;
    font-size: 14px; outline: none;
  }
  .field-block input[type="text"]:focus { border-color: #4285f4; box-shadow: 0 0 0 2px rgba(66,133,244,0.2); }
  .field-hint { font-size: 12px; color: #888; margin-top: 3px; }
  .edit-preview {
    margin-top: 8px; width: 100px; height: 100px; object-fit: cover;
    border-radius: 4px; border: 1px solid #ddd; display: block;
  }

  #edit-actions { display: flex; gap: 12px; margin-top: 24px; align-items: center; }
  #btn-save {
    background: #1a73e8; color: #fff; border: none; border-radius: 4px;
    padding: 9px 24px; cursor: pointer; font-size: 14px; font-weight: 600;
  }
  #btn-save:hover:not(:disabled) { background: #1557b0; }
  #btn-save:disabled { background: #aac4f0; cursor: default; }
  #save-status { font-size: 13px; color: #555; }
  #save-error { color: #c62828; font-size: 13px; }
</style>
