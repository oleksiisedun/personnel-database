<script>
  // Core: app bootstrap (init), data loading/refresh, shared state and helpers used by every view.
  // One of several WebEditor.*.js.html fragments sharing a single global scope; include order is set in WebEditor.html.

  google.script.host.setWidth(screen.availWidth);

  google.script.host.setHeight(screen.availHeight);

  let schema = null;       // { columns: [{name, type, dropdownOptions?, tableHeaders?: [{name, type, dropdownOptions?}]}], rows: [{rowIndex, values[]}] }

  const selectedKeys = new Set(); // compound "spreadsheetId:rowIndex" keys of rows checked for export

  /**
   * Returns a stable unique key for a row, combining spreadsheetId and rowIndex.
   * Local rows (no spreadsheetId) use an empty string prefix.
   * @param {{rowIndex: number, spreadsheetId?: string}} row
   * @returns {string}
   */
  const rowKey = row => `${row.spreadsheetId ?? ''}:${row.rowIndex}`;

  /**
   * True when row's first column (full name) is in the Actual Personnel list.
   * @param {{values: string[]}} row
   * @returns {boolean}
   */
  const isActualPersonnelRow = row => schema.actualPersonnelNamesSet.has((row.values[0] ?? '').trim().toUpperCase());

  /**
   * Returns all checked rows, regardless of the current filter view, ready
   * for export/move/delete. When the Actual Personnel filter is on, rows not
   * on that list are excluded even if they were checked under a different
   * filter state — otherwise a stale selection could silently export/move/
   * delete people the filtered view no longer shows.
   * @returns {Array<{rowIndex: number, spreadsheetId?: string, values: string[]}>}
   */
  function getSelectedRows() {
    return schema.rows
      .filter(r => selectedKeys.has(rowKey(r)))
      .filter(r => !filterActualPersonnel || isActualPersonnelRow(r));
  }

  /**
   * Returns getSelectedRows() as rowEntries, ready to send to a server
   * function that takes {rowIndex, spreadsheetId}[] (export/move/delete).
   * @returns {Array<{rowIndex: number, spreadsheetId: string|null}>}
   */
  function getSelectedRowEntries() {
    return getSelectedRows().map(r => ({ rowIndex: r.rowIndex, spreadsheetId: r.spreadsheetId ?? null }));
  }

  /**
   * Returns the indices of schema.columns that are NOT currently hidden via the
   * column-visibility panel, in column order. Sent to exportXLSX() so the
   * server knows which columns to include.
   * @returns {number[]}
   */
  function getVisibleColumnIndices() {
    return schema.columns.map((_, i) => i).filter(i => !hiddenColumns.has(i));
  }

  /**
   * Returns a debounced version of fn that fires only after delay ms of silence.
   * @param {Function} fn
   * @param {number} delay - Milliseconds to wait after the last call.
   * @returns {Function}
   */
  function debounce(fn, delay) {
    let timer;
    return () => { clearTimeout(timer); timer = setTimeout(fn, delay); };
  }

  /**
   * Kicks off up to `concurrency` concurrent workers pulling from a `count`-item
   * queue. `next` is a self-scheduling dispatcher (it calls itself again once
   * its own unit of work completes, until the queue is drained) — this just
   * starts the initial pool. Used by queueImageFetch() and queueMasterSourceFetch()
   * to run their respective google.script.run batches with bounded concurrency.
   * @param {number} concurrency
   * @param {number} count - Number of dispatch units in the queue (items or batches).
   * @param {() => void} next
   * @returns {void}
   */
  function startWorkerPool(concurrency, count, next) {
    const workers = Math.min(concurrency, count);
    for (let i = 0; i < workers; i++) next();
  }

  /**
   * Sets the text of an error element and makes it visible.
   * @param {string} elementId - ID of the error display element.
   * @param {string} prefix - Message prefix, e.g. "Save failed".
   * @param {Error|string} err - Error object or message string.
   */
  function showError(elementId, prefix, err) {
    const el = document.getElementById(elementId);
    el.textContent = `${prefix}: ${err.message || err}`;
    el.style.display = 'block';
  }

  /**
   * Groups row indexes from a list of row entries by source spreadsheetId.
   * Used to build the argument for adjustRowIndexesAfterDelete().
   * @param {Array<{rowIndex: number, spreadsheetId: string|null}>} entries
   * @returns {Map<string|null, number[]>}
   */
  function groupRowIndexesBySource(entries) {
    const bySource = new Map();
    entries.forEach(({ rowIndex, spreadsheetId }) => {
      const key = spreadsheetId ?? null;
      if (!bySource.has(key)) bySource.set(key, []);
      bySource.get(key).push(rowIndex);
    });
    return bySource;
  }

  /**
   * Decrements, in place, the cached rowIndex of the given rows when one or
   * more rows have been hard-deleted from a source sheet. Rows below a deleted
   * row in the same spreadsheet have their sheet row numbers shifted up by one
   * per deletion, so the cached indexes must be adjusted to match the new reality.
   * @param {Array<{rowIndex: number, spreadsheetId?: string|null}>} rows - Cached rows, typically schema.rows.
   * @param {Map<string|null, number[]>} deletedBySource - Map of spreadsheetId (null=local)
   *   to the array of deleted rowIndexes within that spreadsheet.
   */
  function adjustRowIndexesAfterDelete(rows, deletedBySource) {
    rows.forEach(r => {
      const deletedIndexes = deletedBySource.get(r.spreadsheetId ?? null);
      if (!deletedIndexes) return;
      r.rowIndex -= deletedIndexes.filter(idx => idx < r.rowIndex).length;
    });
  }

  /**
   * Dims #data-table with the .filtering class, waits two animation frames
   * (so the dimmed state paints before synchronous work runs), executes fn,
   * then removes the dimming class.
   * @param {Function} fn - Synchronous work to run once dimmed.
   */
  function dimTableWhile(fn) {
    const table = document.getElementById('data-table');
    table.classList.add('filtering');
    requestAnimationFrame(() => requestAnimationFrame(() => {
      fn();
      table.classList.remove('filtering');
    }));
  }

  /**
   * Entry point. Wires up all static event listeners and kicks off the
   * initial data load from the server via google.script.run.
   */
  function init() {
    document.getElementById('btn-back').addEventListener('click', () => {
      if (formValuesChanged()) {
        openUnsavedChangesOverlay();
      } else {
        leaveEditView();
      }
    });
    document.getElementById('edit-title').addEventListener('click', () => switchEditTab('main'));
    document.getElementById('btn-unsaved-cancel').addEventListener('click', closeUnsavedChangesOverlay);
    document.getElementById('btn-unsaved-discard').addEventListener('click', () => {
      closeUnsavedChangesOverlay();
      leaveEditView();
    });
    document.getElementById('btn-save').addEventListener('click', saveRow);
    document.getElementById('btn-delete').addEventListener('click', deletePerson);
    document.getElementById('lightbox').addEventListener('click', () => {
      document.getElementById('lightbox').style.display = 'none';
    });
    const chkRegex = document.getElementById('chk-regex');
    chkRegex.addEventListener('change', () => {
      useRegex = chkRegex.checked;
      setTimeout(applyFilters, 0);
    });
    const addBtn = document.getElementById('btn-add-person');
    if (addBtn) addBtn.addEventListener('click', addPerson);
    document.getElementById('btn-refresh').addEventListener('click', refreshAll);
    document.getElementById('btn-reset').addEventListener('click', resetListState);
    document.getElementById('btn-export-f1').addEventListener('click', () => runExport('btn-export-f1', 'exportF1'));
    document.getElementById('btn-export-wc').addEventListener('click', () => runExport('btn-export-wc', 'exportWC'));
    document.getElementById('btn-export-xlsx').addEventListener('click', runExportXlsx);
    document.getElementById('btn-export-close').addEventListener('click', () => {
      if (INITIAL_MODE === 'photoExport') { google.script.host.close(); return; }
      document.getElementById('export-overlay').style.display = 'none';
    });
    document.getElementById('btn-export-cancel').addEventListener('click', () => {
      if (pendingExportState) {
        document.getElementById(pendingExportState.btnId).disabled = false;
        pendingExportState = null;
      }
      document.getElementById('export-overlay').style.display = 'none';
    });
    document.getElementById('btn-export-proceed').addEventListener('click', () => {
      if (!pendingExportState) return;
      const state = pendingExportState;
      pendingExportState = null;
      document.getElementById('export-confirm-wrap').style.display = 'none';
      if (state.mode === 'xlsx') {
        startXlsxExportProgress(state.entries, state.total);
      } else {
        startExportProgress(state.btnId, state.serverFnName, state.entries, state.total);
      }
    });
    document.getElementById('btn-schema-warning').addEventListener('click', openSchemaWarningOverlay);
    document.getElementById('btn-schema-warning-close').addEventListener('click', closeSchemaWarningOverlay);
    document.getElementById('btn-move').addEventListener('click', openMoveOverlay);
    document.getElementById('btn-move-cancel').addEventListener('click', closeMoveOverlay);
    document.getElementById('btn-move-confirm').addEventListener('click', runMove);
    document.getElementById('btn-delete-bulk').addEventListener('click', deletePersonnelBulk);
    document.getElementById('btn-columns').addEventListener('click', e => {
      e.stopPropagation();
      const panel = document.getElementById('col-panel');
      panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    });
    // Prevent clicks inside the panel from closing it via the document listener below.
    document.getElementById('col-panel').addEventListener('click', e => e.stopPropagation());
    document.addEventListener('click', () => {
      document.getElementById('col-panel').style.display = 'none';
    });

    if (INITIAL_MODE === 'photoExport') {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('toolbar').style.display = 'none';
      document.getElementById('table-wrapper').style.display = 'none';
      startPhotoExportFlow();
      return;
    }

    openImageDB(); // start DB open in parallel with getSchemaAndData
    google.script.run
      .withSuccessHandler(onDataLoaded)
      .withFailureHandler(onLoadError)
      .getSchemaAndData();
  }

  /**
   * Builds a trimmed, uppercased-name Set from actualPersonnelNames for
   * case-insensitive O(1) lookups in applyFilters(), or undefined when the
   * list is absent/empty.
   * @param {string[]|null|undefined} names
   * @returns {Set<string>|undefined}
   */
  function buildActualPersonnelNamesSet(names) {
    return names?.length ? new Set(names.map(n => n.trim().toUpperCase())) : undefined;
  }

  /**
   * Starts streaming in Master Mode remote sources when the schema indicates
   * there's at least one to fetch.
   * @param {{masterMode: boolean, masterSourceIds: string[]}} data
   */
  function maybeQueueMasterSourceFetch(data) {
    if (data.masterMode && data.masterSourceIds?.length) queueMasterSourceFetch();
  }

  /**
   * Success handler for the initial getSchemaAndData() call.
   * Awaits the IndexedDB cache load so renderList() can display cached images
   * immediately, then builds and shows the table.
   * @param {{columns: Object[], rows: Object[]}} data
   * @returns {Promise<void>}
   */
  async function onDataLoaded(data) {
    schema = data;
    schema.sourceColumnMismatches = {};
    await loadCacheFromIndexedDB();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('btn-refresh').style.display = '';
    if (data.masterMode) {
      document.getElementById('btn-move').style.display = '';
      document.getElementById('all-units-label').style.display = '';
      const chkAllUnits = document.getElementById('chk-all-units');
      chkAllUnits.addEventListener('change', () => {
        showAllUnits = chkAllUnits.checked;
        dimTableWhile(applyFilters);
      });
    }
    const chkActual = document.getElementById('chk-actual');
    if (data.actualPersonnelNames?.length) {
      schema.actualPersonnelNamesSet = buildActualPersonnelNamesSet(data.actualPersonnelNames);
      chkActual.disabled = false;
      chkActual.checked = true;
      filterActualPersonnel = true;
      chkActual.addEventListener('change', () => {
        filterActualPersonnel = chkActual.checked;
        dimTableWhile(applyFilters);
      });
    }
    buildListView();
    applyFilters();
    document.getElementById('data-table').style.display = 'table';
    updateStickyOffsets();
    maybeQueueMasterSourceFetch(data);
  }

  /**
   * Failure handler for the initial getSchemaAndData() call.
   * Hides the loading indicator and shows the error message in the list view.
   * @param {Error} err
   */
  function onLoadError(err) {
    document.getElementById('loading').style.display = 'none';
    showError('error-msg', 'Error loading data', err);
  }

  /**
   * Resets Columns, Filters, and Selections to their default state and re-renders.
   * Does not touch schema.rows — no server round-trip (unlike refreshAll()).
   */
  function resetListState() {
    const btn = document.getElementById('btn-reset');
    btn.disabled = true;

    dimTableWhile(() => {
      document.querySelectorAll('#filter-row input[type=text]').forEach(input => { input.value = ''; });

      useRegex = false;
      document.getElementById('chk-regex').checked = false;

      const chkActual = document.getElementById('chk-actual');
      if (!chkActual.disabled) {
        filterActualPersonnel = true;
        chkActual.checked = true;
      }

      showAllUnits = true;
      document.getElementById('chk-all-units').checked = true;

      hiddenColumns.clear();
      buildColumnPanel(); // rebuilds column-panel checkboxes as all-checked

      selectedKeys.clear();

      applyFilters(); // renderList() re-applies column visibility + updateSelectionUI()

      btn.disabled = false;
    });
  }

  let refreshGeneration = 0; // bumped on each refresh; lets stale in-flight master-source fetches self-cancel

  /**
   * Re-runs the initial data load (local rows + Master Mode sources) without
   * closing the dialog, so the user can pull in changes made by other admins
   * since the dialog was opened. Unlike onDataLoaded(), this does not rebuild
   * the filter DOM (would wipe typed filter text) or re-attach checkbox
   * listeners (would stack duplicates on #chk-all-units / #chk-actual).
   * Dims #data-table with the .filtering class for the duration of the
   * server round-trip, the same as resetListState().
   */
  function refreshAll() {
    document.getElementById('btn-refresh').disabled = true;
    document.getElementById('data-table').classList.add('filtering');
    refreshGeneration++;
    google.script.run
      .withSuccessHandler(onRefreshSuccess)
      .withFailureHandler(onRefreshError)
      .getSchemaAndData();
  }

  /**
   * Success handler for refreshAll(). Replaces row/master-source data in
   * place and re-renders via applyFilters(), preserving current filter input
   * values and column visibility settings.
   * @param {{columns: Object[], rows: Object[]}} data
   */
  function onRefreshSuccess(data) {
    selectedKeys.clear(); // rowIndexes may have shifted if rows were added/removed upstream
    schema.rows = data.rows;
    schema.masterMode = data.masterMode;
    schema.masterSourceIds = data.masterSourceIds;
    schema.masterSources = data.masterSources;
    schema.sourceColumnMismatches = {};
    schema.actualPersonnelNames = data.actualPersonnelNames;
    schema.actualPersonnelNamesSet = buildActualPersonnelNamesSet(data.actualPersonnelNames);
    document.getElementById('chk-actual').disabled = !schema.actualPersonnelNamesSet;
    updateSchemaWarningIcon();
    applyFilters();
    document.getElementById('btn-refresh').disabled = false;
    document.getElementById('data-table').classList.remove('filtering');
    maybeQueueMasterSourceFetch(data);
  }

  /**
   * Failure handler for refreshAll().
   * @param {Error} err
   */
  function onRefreshError(err) {
    document.getElementById('btn-refresh').disabled = false;
    document.getElementById('data-table').classList.remove('filtering');
    showError('error-msg', 'Error refreshing data', err);
  }

  /**
   * Streams in additional Master Mode source spreadsheets' rows after the
   * initial (local-only) render, via a worker pool over getMasterSourceRows()
   * (mirrors queueImageFetch()'s concurrency pattern). Newly-arrived rows and
   * source names are merged into schema and the list is silently re-filtered;
   * inaccessible sources are skipped, same as the previous synchronous loop.
   */
  function queueMasterSourceFetch() {
    const myGeneration = refreshGeneration;
    const ids = schema.masterSourceIds.slice();
    const concurrency = schema.masterModeFetchConcurrency;
    const debouncedApplyFilters = debounce(applyFilters, schema.filterDebounceMs);
    let offset = 0;
    /** Fetches the next source's rows and, on completion, calls itself again. @returns {void} */
    const fetchNext = () => {
      if (myGeneration !== refreshGeneration) return; // a newer refresh superseded this run
      if (offset >= ids.length) return;
      const id = ids[offset++];
      google.script.run
        .withSuccessHandler(result => {
          if (myGeneration !== refreshGeneration) return;
          if (result.columnMismatches?.length) {
            schema.sourceColumnMismatches[result.id] = result.columnMismatches;
          } else {
            schema.rows.push(...result.rows);
          }
          schema.masterSources.push({ id: result.id, name: result.name });
          updateSchemaWarningIcon();
          debouncedApplyFilters();
          fetchNext();
        })
        .withFailureHandler(() => {
          if (myGeneration !== refreshGeneration) return;
          updateSchemaWarningIcon();
          fetchNext();
        })
        .getMasterSourceRows(id);
    };
    startWorkerPool(concurrency, ids.length, fetchNext);
  }

  /**
   * Switches between the list view and the edit view by toggling display styles.
   * The list view uses display:flex (it is a flex column layout); the edit view
   * uses display:block.
   * @param {'list'|'edit'} name
   */
  function showView(name) {
    document.getElementById('view-list').style.display = name === 'list' ? 'flex' : 'none';
    document.getElementById('view-edit').style.display = name === 'edit' ? 'block' : 'none';
  }

  document.addEventListener('DOMContentLoaded', init);
</script>
