<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <?!= HtmlService.createHtmlOutputFromFile('WebEditor_css').getContent(); ?>
  <? var editMode = getEditMode(); var colMinWidths = getColumnMinWidths(); ?>
  <style>
    :root {
      --text-min-width: <?= colMinWidths.text ?>px;
      --col-image-min-width: <?= colMinWidths.image ?>px;
      --col-table-min-width: <?= colMinWidths.table ?>px;
    }
  </style>
</head>
<body>

  <!-- List View -->
  <div id="view-list">
    <div id="loading">Loading…</div>
    <div id="error-msg" style="display:none"></div>
    <div id="toolbar">
      <? if (editMode) { ?><button id="btn-add-person">Add person</button><? } else { ?><span id="readonly-label">Read-only view</span><? } ?>
      <div id="toolbar-right">
        <label id="regex-label"><input type="checkbox" id="chk-regex"> Search using REGEX</label>
        <div id="col-toggle-wrap">
          <button id="btn-columns">Columns ▾</button>
          <div id="col-panel" style="display:none"></div>
        </div>
      </div>
    </div>
    <div id="table-wrapper">
      <table id="data-table" style="display:none">
        <thead>
          <tr id="filter-row"></tr>
          <tr id="header-row"></tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </div>

  <!-- Edit View -->
  <div id="view-edit" style="display:none">
    <div id="edit-header">
      <button id="btn-back">← Back</button>
      <div id="edit-title"></div>
    </div>
    <div id="edit-form"></div>
    <div id="edit-actions">
      <button id="btn-save">Save</button>
      <span id="save-status"></span>
    </div>
    <div id="save-error" style="display:none"></div>
  </div>

  <!-- Lightbox -->
  <div id="lightbox" style="display:none">
    <img id="lightbox-img" alt="">
  </div>

  <?!= HtmlService.createHtmlOutputFromFile('WebEditor_js').getContent(); ?>
</body>
</html>
