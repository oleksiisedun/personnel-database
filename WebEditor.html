<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    /* ── Column width constraints (edit here) ── */
    :root { --col-min-width: 150px; --col-image-min-width: 150px; --col-table-min-width: 900px; }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: Arial, sans-serif; font-size: 14px; color: #333; background: #fff; }

    /* ── List view ── */
    #view-list { height: 100%; display: flex; flex-direction: column; padding: 12px; overflow: hidden; }
    #loading { padding: 40px; text-align: center; color: #888; }
    #error-msg { padding: 16px; color: #c62828; background: #ffebee; border-radius: 4px; margin-bottom: 12px; flex-shrink: 0; }
    #table-wrapper { flex: 1; overflow: scroll; }

    #data-table { width: 100%; border-collapse: collapse; }
    #data-table th, #data-table td {
      border: 1px solid #ddd; padding: 6px 10px; text-align: left; vertical-align: middle;
    }
    .cell-content {
      min-width: var(--col-min-width);
      white-space: normal; word-break: break-word;
    }
    .cell-content--image { min-width: var(--col-image-min-width); }
    .cell-content--table { min-width: var(--col-table-min-width); max-width: none; }

    .mini-table { border-collapse: collapse; width: 100%; font-size: 12px; }
    .mini-table th, .mini-table td { border: 1px solid #e0e0e0; padding: 2px 6px; text-align: left; white-space: normal; word-break: break-word; }
    .mini-table thead th { background: #f0f0f0; font-weight: 600; color: #555; }

    .table-editor { width: 100%; overflow-x: auto; margin-top: 8px; }
    .table-editor table { border-collapse: collapse; width: 100%; font-size: 13px; }
    .table-editor th, .table-editor td { border: 1px solid #ddd; padding: 4px 6px; }
    .table-editor thead th { background: #f5f5f5; font-weight: 600; font-size: 12px; color: #555; white-space: nowrap; }
    .table-editor td:last-child { width: 28px; text-align: center; }
    .table-editor input[type="text"] {
      width: 100%; min-width: 80px; padding: 4px 6px; border: 1px solid #ccc;
      border-radius: 3px; font-size: 13px; outline: none; box-sizing: border-box;
    }
    .table-editor input[type="text"]:focus { border-color: #4285f4; box-shadow: 0 0 0 2px rgba(66,133,244,0.2); }
    .btn-delete-row { background: none; border: none; cursor: pointer; color: #c62828; font-size: 16px; padding: 0 4px; }
    .btn-delete-row:hover { color: #b71c1c; }
    .btn-add-row { margin-top: 6px; background: none; border: 1px solid #4285f4; color: #4285f4; border-radius: 4px; padding: 4px 12px; cursor: pointer; font-size: 13px; display: block; }
    .btn-add-row:hover { background: #e8f0fe; }
    #toolbar { flex-shrink: 0; padding: 0 0 8px; }
    #col-toggle-wrap { position: relative; display: inline-block; }
    #btn-columns {
      background: none; border: 1px solid #ccc; border-radius: 4px;
      padding: 5px 12px; cursor: pointer; font-size: 13px; color: #555;
    }
    #btn-columns:hover { background: #f5f5f5; }
    #col-panel {
      position: absolute; top: calc(100% + 4px); left: 0; z-index: 100;
      background: #fff; border: 1px solid #ddd; border-radius: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      padding: 8px 12px; min-width: 180px; max-height: 300px; overflow-y: auto;
    }
    #col-panel label {
      display: flex; align-items: center; gap: 8px;
      padding: 4px 0; cursor: pointer; font-size: 13px; white-space: nowrap;
    }
    #data-table thead th { background: #f5f5f5; font-weight: 600; position: sticky; top: 0; z-index: 1; }
    #data-table tbody tr:nth-child(even) { background: #fafafa; }
    #data-table tbody tr:hover { background: #e8f0fe; }
    #filter-row th { padding: 4px 6px; }
    #filter-row input {
      width: 100%; padding: 4px 6px; border: 1px solid #ccc; border-radius: 3px;
      font-size: 13px; outline: none;
    }
    #filter-row input:focus { border-color: #4285f4; }

    .name-link {
      color: #1a73e8; text-decoration: none; cursor: pointer;
    }
    .name-link:hover { text-decoration: underline; }

    .thumb { width: 100%; height: auto; border-radius: 4px; cursor: pointer; display: block; }
    .thumb:not([src]), .thumb[src=""] { background: #f0f0f0; min-height: 48px; cursor: default; }
    .no-image { color: #bbb; font-style: italic; }

    /* ── Lightbox ── */
    #lightbox {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.82); display: flex;
      align-items: center; justify-content: center; z-index: 9999; cursor: pointer;
    }
    #lightbox img {
      max-width: 90vw; max-height: 90vh; border-radius: 8px;
      box-shadow: 0 4px 32px rgba(0,0,0,0.5);
    }

    /* ── Edit view ── */
    #view-edit { height: 100%; overflow-y: scroll; padding: 16px; }
    #edit-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    #btn-back {
      background: none; border: 1px solid #ccc; border-radius: 4px;
      padding: 6px 14px; cursor: pointer; font-size: 14px; color: #555;
    }
    #btn-back:hover { background: #f5f5f5; }
    #edit-title { font-size: 18px; font-weight: 600; }

    .field-block { margin-bottom: 16px; }
    .field-block label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 13px; color: #555; }
    .field-block input[type="text"] {
      width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px;
      font-size: 14px; outline: none;
    }
    .field-block input[type="text"]:focus { border-color: #4285f4; box-shadow: 0 0 0 2px rgba(66,133,244,0.2); }
    .field-hint { font-size: 12px; color: #888; margin-top: 3px; }
    .edit-preview {
      margin-top: 8px; width: 100px; height: 100px; object-fit: cover;
      border-radius: 4px; border: 1px solid #ddd; display: block;
    }

    #edit-actions { display: flex; gap: 12px; margin-top: 24px; align-items: center; }
    #btn-save {
      background: #1a73e8; color: #fff; border: none; border-radius: 4px;
      padding: 9px 24px; cursor: pointer; font-size: 14px; font-weight: 600;
    }
    #btn-save:hover:not(:disabled) { background: #1557b0; }
    #btn-save:disabled { background: #aac4f0; cursor: default; }
    #save-status { font-size: 13px; color: #555; }
    #save-error { color: #c62828; font-size: 13px; }
  </style>
</head>
<body>

  <!-- List View -->
  <div id="view-list">
    <div id="loading">Loading…</div>
    <div id="error-msg" style="display:none"></div>
    <div id="toolbar">
      <div id="col-toggle-wrap">
        <button id="btn-columns">Columns ▾</button>
        <div id="col-panel" style="display:none"></div>
      </div>
    </div>
    <div id="table-wrapper">
      <table id="data-table" style="display:none">
        <thead>
          <tr id="filter-row"></tr>
          <tr id="header-row"></tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </div>

  <!-- Edit View -->
  <div id="view-edit" style="display:none">
    <div id="edit-header">
      <button id="btn-back">← Back</button>
      <div id="edit-title"></div>
    </div>
    <div id="edit-form"></div>
    <div id="edit-actions">
      <button id="btn-save">Save</button>
      <span id="save-status"></span>
    </div>
    <div id="save-error" style="display:none"></div>
  </div>

  <!-- Lightbox -->
  <div id="lightbox" style="display:none">
    <img id="lightbox-img" alt="">
  </div>

  <script>
    google.script.host.setWidth(screen.availWidth);
    google.script.host.setHeight(screen.availHeight);

    let schema = null;
    let filteredRows = [];
    let editingRow = null;
    let pendingValues = null;
    let hiddenColumns = new Set();
    let imageCache = {};
    let pendingImages = new Set();

    const FIELD_SEP = ' | ';
    const ROW_SEP = '\n';
    const parseData = (cell, fields) => {
      if (!cell) return [];
      return cell.split(ROW_SEP).map(row => {
        const values = row.split(FIELD_SEP);
        return Object.fromEntries(fields.map((key, i) => [key, values[i] ?? '']));
      });
    };
    const mergeData = (data, fields, filterKey) => data
      .filter(r => r[filterKey])
      .map(r => fields.map(f => r[f] ?? '').join(FIELD_SEP))
      .join(ROW_SEP);

    function isTableType(col) { return col.type.endsWith('-table'); }

    function init() {
      document.getElementById('btn-back').addEventListener('click', function() {
        showView('list');
      });
      document.getElementById('btn-save').addEventListener('click', saveRow);
      document.getElementById('lightbox').addEventListener('click', function() {
        document.getElementById('lightbox').style.display = 'none';
      });
      document.getElementById('btn-columns').addEventListener('click', function(e) {
        e.stopPropagation();
        var panel = document.getElementById('col-panel');
        panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
      });
      document.getElementById('col-panel').addEventListener('click', function(e) {
        e.stopPropagation();
      });
      document.addEventListener('click', function() {
        document.getElementById('col-panel').style.display = 'none';
      });

      google.script.run
        .withSuccessHandler(onDataLoaded)
        .withFailureHandler(onLoadError)
        .getSchemaAndData();
    }

    function onDataLoaded(data) {
      schema = data;
      document.getElementById('loading').style.display = 'none';
      buildListView();
      applyFilters();
      document.getElementById('data-table').style.display = 'table';
      updateStickyOffsets();
    }

    function onLoadError(err) {
      document.getElementById('loading').style.display = 'none';
      var el = document.getElementById('error-msg');
      el.textContent = 'Error loading data: ' + (err.message || err);
      el.style.display = 'block';
    }

    function buildListView() {
      var filterRow = document.getElementById('filter-row');
      var headerRow = document.getElementById('header-row');
      filterRow.innerHTML = '';
      headerRow.innerHTML = '';

      schema.columns.forEach(function(col, i) {
        // Header
        var th = document.createElement('th');
        th.dataset.colIndex = i;
        var hDiv = document.createElement('div');
        hDiv.className = 'cell-content';
        if (col.type === 'image') hDiv.classList.add('cell-content--image');
        if (isTableType(col)) hDiv.classList.add('cell-content--table');
        hDiv.textContent = col.name;
        th.appendChild(hDiv);
        headerRow.appendChild(th);

        // Filter input (text columns only)
        var fth = document.createElement('th');
        fth.dataset.colIndex = i;
        var fDiv = document.createElement('div');
        fDiv.className = 'cell-content';
        if (col.type === 'text') {
          var input = document.createElement('input');
          input.type = 'text';
          input.placeholder = 'Filter…';
          input.dataset.colIndex = i;
          input.addEventListener('input', applyFilters);
          fDiv.appendChild(input);
        }
        fth.appendChild(fDiv);
        filterRow.appendChild(fth);
      });
      buildColumnPanel();
    }

    function applyFilters() {
      var inputs = document.querySelectorAll('#filter-row input');
      var filters = {};
      inputs.forEach(function(inp) {
        var val = inp.value.trim().toLowerCase();
        if (val) filters[inp.dataset.colIndex] = val;
      });

      filteredRows = schema.rows.filter(function(row) {
        return Object.keys(filters).every(function(colIdx) {
          return (row.values[colIdx] || '').toLowerCase().includes(filters[colIdx]);
        });
      });

      renderList();
    }

    function renderList() {
      var tbody = document.getElementById('table-body');
      tbody.innerHTML = '';

      filteredRows.forEach(function(row) {
        var tr = document.createElement('tr');
        row.values.forEach(function(val, i) {
          var td = document.createElement('td');
          td.dataset.colIndex = i;
          var col = schema.columns[i];

          var cell = document.createElement('div');
          cell.className = 'cell-content';

          if (col.type === 'image') cell.classList.add('cell-content--image');
          if (isTableType(col)) {
            cell.classList.add('cell-content--table');
            cell.appendChild(buildMiniTable(parseData(val, col.tableHeaders || []), col.tableHeaders || []));
          } else if (col.type === 'image') {
            var id = extractDriveId(val);
            if (id) {
              var img = document.createElement('img');
              img.className = 'thumb';
              img.alt = '';
              if (imageCache[id]) {
                img.src = imageCache[id];
              } else {
                img.dataset.fileId = id;
              }
              (function(fileId) {
                img.addEventListener('click', function() { openLightbox(fileId); });
              })(id);
              cell.appendChild(img);
            } else {
              var span = document.createElement('span');
              span.className = 'no-image';
              span.textContent = '—';
              cell.appendChild(span);
            }
          } else if (i === 0) {
            var a = document.createElement('a');
            a.className = 'name-link';
            a.href = '#';
            a.textContent = val;
            (function(r) {
              a.addEventListener('click', function(e) {
                e.preventDefault();
                openEditView(r);
              });
            })(row);
            cell.appendChild(a);
          } else {
            cell.textContent = val;
          }

          td.appendChild(cell);

          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
      applyColumnVisibility();
      queueImageFetch();
    }

    function queueImageFetch() {
      document.querySelectorAll('img[data-file-id]').forEach(function(img) {
        var id = img.dataset.fileId;
        if (!id || pendingImages.has(id)) return;
        pendingImages.add(id);
        (function(fileId) {
          google.script.run
            .withSuccessHandler(function(dataUrls) {
              pendingImages.delete(fileId);
              imageCache[fileId] = dataUrls[fileId] || null;
              if (dataUrls[fileId]) {
                document.querySelectorAll('img[data-file-id="' + fileId + '"]').forEach(function(el) {
                  el.src = dataUrls[fileId];
                  el.removeAttribute('data-file-id');
                });
              }
            })
            .withFailureHandler(function() { pendingImages.delete(fileId); })
            .getImagesDataUrls([fileId]);
        })(id);
      });
    }

    function buildColumnPanel() {
      var panel = document.getElementById('col-panel');
      panel.innerHTML = '';

      // "Select all" row
      var allLabel = document.createElement('label');
      allLabel.style.cssText = 'font-weight:600; padding-bottom:6px; margin-bottom:4px; border-bottom:1px solid #eee;';
      var allCb = document.createElement('input');
      allCb.type = 'checkbox';
      allCb.id = 'col-select-all';
      allCb.addEventListener('change', function() {
        schema.columns.forEach(function(col, i) {
          if (i === 0) return;
          if (allCb.checked) hiddenColumns.delete(i);
          else hiddenColumns.add(i);
        });
        panel.querySelectorAll('input[data-cb-col]').forEach(function(cb) {
          if (parseInt(cb.dataset.cbCol) !== 0) cb.checked = allCb.checked;
        });
        applyColumnVisibility();
      });
      allLabel.appendChild(allCb);
      allLabel.appendChild(document.createTextNode(' Select all'));
      panel.appendChild(allLabel);

      // Per-column rows
      schema.columns.forEach(function(col, i) {
        var label = document.createElement('label');
        var cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = !hiddenColumns.has(i);
        cb.dataset.cbCol = i;
        if (i === 0) {
          cb.disabled = true;
        } else {
          (function(idx) {
            cb.addEventListener('change', function() {
              if (this.checked) hiddenColumns.delete(idx);
              else hiddenColumns.add(idx);
              updateSelectAll();
              applyColumnVisibility();
            });
          })(i);
        }
        label.appendChild(cb);
        label.appendChild(document.createTextNode(' ' + col.name));
        panel.appendChild(label);
      });

      updateSelectAll();
    }

    function updateSelectAll() {
      var allCb = document.getElementById('col-select-all');
      if (!allCb || schema.columns.length <= 1) return;
      var hiddenCount = 0;
      schema.columns.forEach(function(col, i) {
        if (i !== 0 && hiddenColumns.has(i)) hiddenCount++;
      });
      var total = schema.columns.length - 1;
      if (hiddenCount === 0) {
        allCb.checked = true; allCb.indeterminate = false;
      } else if (hiddenCount === total) {
        allCb.checked = false; allCb.indeterminate = false;
      } else {
        allCb.indeterminate = true;
      }
    }

    function applyColumnVisibility() {
      document.querySelectorAll('#data-table th[data-col-index], #data-table td[data-col-index]').forEach(function(el) {
        el.style.display = hiddenColumns.has(parseInt(el.dataset.colIndex)) ? 'none' : '';
      });
    }

    function updateStickyOffsets() {
      var filterHeight = document.getElementById('filter-row').offsetHeight;
      document.querySelectorAll('#header-row th').forEach(function(th) {
        th.style.top = filterHeight + 'px';
      });
    }

    function extractDriveId(url) {
      if (!url) return null;
      var m = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
      if (m) return m[1];
      m = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      if (m) return m[1];
      // bare ID (no slashes or dots)
      if (/^[a-zA-Z0-9_-]{10,}$/.test(url.trim())) return url.trim();
      return null;
    }

    function openLightbox(fileId) {
      var imgEl = document.getElementById('lightbox-img');
      document.getElementById('lightbox').style.display = 'flex';
      if (imageCache[fileId]) {
        imgEl.src = imageCache[fileId];
      } else {
        imgEl.src = '';
        google.script.run
          .withSuccessHandler(function(dataUrls) {
            if (dataUrls[fileId]) { imageCache[fileId] = dataUrls[fileId]; imgEl.src = dataUrls[fileId]; }
          })
          .withFailureHandler(function() {})
          .getImagesDataUrls([fileId]);
      }
    }

    function openEditView(row) {
      editingRow = row;
      var form = document.getElementById('edit-form');
      form.innerHTML = '';

      schema.columns.forEach(function(col, i) {
        var block = document.createElement('div');
        block.className = 'field-block';

        var label = document.createElement('label');
        label.textContent = col.name;
        block.appendChild(label);

        if (isTableType(col)) {
          block.appendChild(buildTableEditor(i, parseData(row.values[i] || '', col.tableHeaders || []), col.tableHeaders || []));
        } else {
          var input = document.createElement('input');
          input.type = 'text';
          input.value = row.values[i] || '';
          input.dataset.colIndex = i;
          block.appendChild(input);

          if (col.type === 'image') {
            var hint = document.createElement('div');
            hint.className = 'field-hint';
            hint.textContent = 'Paste a Google Drive sharing link';
            block.appendChild(hint);

            var preview = document.createElement('img');
            preview.className = 'edit-preview';
            preview.alt = '';
            updatePreview(preview, input.value);
            block.appendChild(preview);

            (function(inp, prev) {
              inp.addEventListener('input', function() {
                updatePreview(prev, inp.value);
              });
            })(input, preview);
          }
        }

        form.appendChild(block);
      });

      document.getElementById('edit-title').textContent =
        row.values[0] || 'Edit record';
      document.getElementById('save-error').style.display = 'none';
      document.getElementById('save-status').textContent = '';
      document.getElementById('btn-save').disabled = false;
      showView('edit');
    }

    function updatePreview(imgEl, url) {
      var id = extractDriveId(url);
      if (!id) { imgEl.src = ''; imgEl.style.display = 'none'; return; }
      imgEl.style.display = 'block';
      if (imageCache[id]) {
        imgEl.src = imageCache[id];
      } else {
        imgEl.src = '';
        google.script.run
          .withSuccessHandler(function(dataUrls) {
            if (dataUrls[id]) { imageCache[id] = dataUrls[id]; imgEl.src = dataUrls[id]; }
          })
          .withFailureHandler(function() {})
          .getImagesDataUrls([id]);
      }
    }

    function buildMiniTable(rows, headers) {
      var table = document.createElement('table');
      table.className = 'mini-table';
      var thead = document.createElement('thead');
      var trHead = document.createElement('tr');
      (headers || []).forEach(function(h) {
        var th = document.createElement('th'); th.textContent = h; trHead.appendChild(th);
      });
      thead.appendChild(trHead);
      table.appendChild(thead);
      var tbody = document.createElement('tbody');
      (rows || []).forEach(function(rowObj) {
        var tr = document.createElement('tr');
        (headers || []).forEach(function(h) {
          var td = document.createElement('td'); td.textContent = rowObj[h] || ''; tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      return table;
    }

    function buildTableEditor(colIndex, rows, headers) {
      var wrapper = document.createElement('div');
      wrapper.className = 'table-editor';
      wrapper.dataset.colIndex = colIndex;
      var table = document.createElement('table');
      var thead = document.createElement('thead');
      var trHead = document.createElement('tr');
      (headers || []).forEach(function(h) {
        var th = document.createElement('th'); th.textContent = h; trHead.appendChild(th);
      });
      trHead.appendChild(document.createElement('th'));
      thead.appendChild(trHead);
      table.appendChild(thead);
      var tbody = document.createElement('tbody');
      (rows || []).forEach(function(rowObj) { addTableEditorRow(tbody, headers, rowObj); });
      table.appendChild(tbody);
      wrapper.appendChild(table);
      var btnAdd = document.createElement('button');
      btnAdd.type = 'button';
      btnAdd.className = 'btn-add-row';
      btnAdd.textContent = '+ Add row';
      (function(tb, hdrs) {
        btnAdd.addEventListener('click', function() { addTableEditorRow(tb, hdrs, null); });
      })(tbody, headers);
      wrapper.appendChild(btnAdd);
      return wrapper;
    }

    function addTableEditorRow(tbody, headers, rowObj) {
      var tr = document.createElement('tr');
      (headers || []).forEach(function(h) {
        var td = document.createElement('td');
        var inp = document.createElement('input');
        inp.type = 'text';
        inp.value = (rowObj && rowObj[h]) ? rowObj[h] : '';
        inp.dataset.field = h;
        td.appendChild(inp);
        tr.appendChild(td);
      });
      var tdDel = document.createElement('td');
      var btnDel = document.createElement('button');
      btnDel.type = 'button';
      btnDel.className = 'btn-delete-row';
      btnDel.textContent = '×';
      btnDel.addEventListener('click', function() { tr.parentNode.removeChild(tr); });
      tdDel.appendChild(btnDel);
      tr.appendChild(tdDel);
      tbody.appendChild(tr);
    }

    function encodeTableEditor(colIndex, col) {
      var wrapper = document.querySelector('.table-editor[data-col-index="' + colIndex + '"]');
      if (!wrapper) return '';
      var rows = [];
      wrapper.querySelectorAll('tbody tr').forEach(function(tr) {
        var obj = {};
        tr.querySelectorAll('input[data-field]').forEach(function(inp) {
          obj[inp.dataset.field] = inp.value;
        });
        rows.push(obj);
      });
      return mergeData(rows, col.tableHeaders || [], (col.tableHeaders || [])[0] || '');
    }

    function saveRow() {
      var newValues = new Array(schema.columns.length).fill('');
      document.querySelectorAll('#edit-form input[data-col-index]').forEach(function(inp) {
        newValues[parseInt(inp.dataset.colIndex)] = inp.value;
      });
      schema.columns.forEach(function(col, i) {
        if (isTableType(col)) newValues[i] = encodeTableEditor(i, col);
      });
      pendingValues = newValues;

      document.getElementById('btn-save').disabled = true;
      document.getElementById('save-status').textContent = 'Saving…';
      document.getElementById('save-error').style.display = 'none';

      google.script.run
        .withSuccessHandler(onSaveSuccess)
        .withFailureHandler(onSaveError)
        .updateRow(editingRow.rowIndex, newValues);
    }

    function onSaveSuccess() {
      if (pendingValues) {
        pendingValues.forEach(function(val, i) { editingRow.values[i] = val; });
        pendingValues = null;
      }
      applyFilters();
      showView('list');
    }

    function onSaveError(err) {
      document.getElementById('btn-save').disabled = false;
      document.getElementById('save-status').textContent = '';
      var el = document.getElementById('save-error');
      el.textContent = 'Save failed: ' + (err.message || err);
      el.style.display = 'block';
    }

    function showView(name) {
      document.getElementById('view-list').style.display = name === 'list' ? 'flex' : 'none';
      document.getElementById('view-edit').style.display = name === 'edit' ? 'block' : 'none';
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
