<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <?!= HtmlService.createHtmlOutputFromFile('WebEditor.css').getContent(); ?>
  <? var colMinWidths = getColumnMinWidths(); var colMaxWidths = getColumnMaxWidths(); ?>
  <style>
    :root {
      --text-min-width: <?= colMinWidths.text ?>px;
      --col-image-min-width: <?= colMinWidths.image ?>px;
      --col-image-max-width: <?= colMaxWidths.image ?>px;
      --col-table-min-width: <?= colMinWidths.table ?>px;
    }
  </style>
</head>
<body>

  <!-- List View -->
  <div id="view-list">
    <div id="loading">Loading…</div>
    <div id="error-msg" style="display:none"></div>
    <div id="toolbar">
      <div id="toolbar-left">
        <button id="btn-add-person" class="btn-secondary">Add Person</button>
        <button id="btn-move" class="btn-secondary" disabled style="display:none">Move Personnel</button>
        <button id="btn-delete-bulk" class="btn-danger" disabled>Delete Personnel</button>
        <button id="btn-export-f1" class="btn-secondary" disabled>Export F-1</button>
        <button id="btn-export-wc" class="btn-secondary" disabled>Export Wanted Card</button>
        <button id="btn-export-xlsx" class="btn-secondary" disabled>Export XLSX</button>
      </div>
      <div id="toolbar-right">
        <button id="btn-schema-warning" class="btn-warning" style="display:none" title="Column schema mismatch in one or more sources">⚠</button>
        <button id="btn-reset" class="btn-warning">Reset</button>
        <button id="btn-refresh" class="btn-success" style="display:none">Refresh</button>
        <label id="all-units-label" style="display:none"><input type="checkbox" id="chk-all-units" checked> All Units</label>
        <label id="actual-label"><input type="checkbox" id="chk-actual" disabled> Actual Personnel</label>
        <label id="regex-label"><input type="checkbox" id="chk-regex"> Use RegEx</label>
        <div id="col-toggle-wrap">
          <button id="btn-columns" class="btn-secondary">Columns ▾</button>
          <div id="col-panel" style="display:none"></div>
        </div>
      </div>
    </div>

    <!-- Schema warning overlay -->
    <div id="schema-warning-overlay" class="overlay" style="display:none">
      <div id="schema-warning-dialog" class="overlay-dialog">
        <h2 style="font-size:16px;margin-bottom:12px;">Column Schema Mismatch</h2>
        <p style="font-size:13px;color:#666;margin-bottom:16px;">These remote spreadsheets have a column layout that differs from the local Database sheet. Their rows were not loaded.</p>
        <div id="schema-warning-content"></div>
        <div id="schema-warning-actions">
          <button id="btn-schema-warning-close" class="btn-secondary btn-dialog-action">Close</button>
        </div>
      </div>
    </div>

    <!-- Move overlay -->
    <div id="move-overlay" class="overlay" style="display:none">
      <div id="move-dialog" class="overlay-dialog">
        <div id="move-dialog-title">Move selected persons to:</div>
        <select id="move-destination"></select>
        <div id="move-status" style="display:none"></div>
        <div id="move-log" style="display:none"></div>
        <div id="move-error" style="display:none"></div>
        <div id="move-actions">
          <button id="btn-move-cancel" class="btn-secondary btn-dialog-action">Cancel</button>
          <button id="btn-move-confirm" class="btn-primary btn-dialog-action">Move</button>
        </div>
      </div>
    </div>

    <!-- Export progress/result overlay -->
    <div id="export-overlay" class="overlay" style="display:none">
      <div id="export-dialog" class="overlay-dialog">
        <div id="export-confirm-wrap" style="display:none">
          <div id="export-confirm-msg"></div>
          <div id="export-confirm-estimate"></div>
          <div id="export-confirm-actions">
            <button id="btn-export-cancel" class="btn-secondary btn-dialog-action">Cancel</button>
            <button id="btn-export-proceed" class="btn-primary btn-dialog-action">Export</button>
          </div>
        </div>
        <div id="export-progress-wrap" style="display:none">
          <div id="export-progress-bar"></div>
        </div>
        <div id="export-msg"></div>
        <ul id="export-links" style="display:none"></ul>
        <div id="export-error" style="display:none"></div>
        <button id="btn-export-close" class="btn-primary btn-dialog-action" style="display:none">Close</button>
      </div>
    </div>

    <div id="table-wrapper">
      <table id="data-table" style="display:none">
        <thead>
          <tr id="filter-row"></tr>
          <tr id="header-row"></tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </div>

  <!-- Edit View -->
  <div id="view-edit" style="display:none">
    <div id="edit-header">
      <button id="btn-back" class="btn-secondary">← Back</button>
      <div id="edit-title"></div>
      <div id="edit-header-actions">
        <span id="save-status"></span>
        <span id="save-error" style="display:none"></span>
        <button id="btn-delete" class="btn-danger" style="display:none">Delete</button>
        <select id="add-spreadsheet-select" style="display:none"></select>
        <button id="btn-save" class="btn-primary">Save</button>
      </div>
    </div>
    <div id="edit-form"></div>
  </div>

  <!-- Unsaved changes overlay -->
  <div id="unsaved-changes-overlay" class="overlay" style="display:none">
    <div id="unsaved-changes-dialog" class="overlay-dialog">
      <div id="unsaved-changes-title">You have unsaved changes</div>
      <p id="unsaved-changes-msg">Leaving now will discard your changes to this record.</p>
      <div class="dialog-actions">
        <button id="btn-unsaved-cancel" class="btn-secondary btn-dialog-action">Keep Editing</button>
        <button id="btn-unsaved-discard" class="btn-danger btn-dialog-action">Discard Changes</button>
      </div>
    </div>
  </div>

  <!-- Lightbox -->
  <div id="lightbox" style="display:none">
    <img id="lightbox-img" alt="">
    <div class="lightbox-pdf-msg" style="display:none">
      <a href="" target="_blank" rel="noopener noreferrer">Open PDF in Drive</a>
    </div>
  </div>

  <?!= HtmlService.createHtmlOutputFromFile('WebEditor.js').getContent(); ?>
</body>
</html>
