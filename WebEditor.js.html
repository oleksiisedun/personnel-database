<script>
  google.script.host.setWidth(screen.availWidth);
  google.script.host.setHeight(screen.availHeight);

  let schema = null;       // { columns: [{name, type, tableHeaders?}], rows: [{rowIndex, values[]}] }
  let filteredRows = [];   // subset of schema.rows currently shown after filters
  let editingRow = null;   // row object open in the edit view
  let pendingValues = null; // newValues[] staged by saveRow(), consumed by onSaveSuccess()
  let hiddenColumns = new Set(); // column indices hidden by the user
  let imageCache = {};     // fileId → { type:'image', dataUrl } | { type:'pdf', viewUrl } | null
  let pendingImages = new Set(); // fileIds currently being fetched to avoid duplicate requests
  let isNewRow = false;    // true when the edit view holds a freshly appended row
  let useRegex = false;    // true when filter inputs are treated as regular expressions

  const FIELD_SEP = ' | ';
  const ROW_SEP = '\n';

  function debounce(fn, delay) {
    let timer;
    return () => { clearTimeout(timer); timer = setTimeout(fn, delay); };
  }

  /**
   * Decodes a pipe-delimited cell string into an array of row objects.
   * Empty cell returns []. Each row object maps field names to string values.
   * @param {string} cell - Raw encoded cell value from the sheet.
   * @param {string[]} fields - Ordered list of field names (sub-column headers).
   * @returns {Object[]}
   */
  const parseData = (cell, fields) => {
    if (!cell) return [];
    return cell.split(ROW_SEP).map(row => {
      const values = row.split(FIELD_SEP);
      return Object.fromEntries(fields.map((key, i) => [key, values[i] ?? '']));
    });
  };

  /**
   * Encodes an array of row objects back into the pipe-delimited cell string.
   * Rows where the first field (filterKey) is empty are excluded.
   * @param {Object[]} data - Array of row objects.
   * @param {string[]} fields - Ordered list of field names.
   * @param {string} filterKey - Field name used to filter out blank rows.
   * @returns {string}
   */
  const mergeData = (data, fields, filterKey) => data
    .filter(r => r[filterKey])
    .map(r => fields.map(f => r[f] ?? '').join(FIELD_SEP))
    .join(ROW_SEP);

  /**
   * Returns true if the column type is a *-table type (e.g. relatives-table).
   * @param {{type: string}} col
   * @returns {boolean}
   */
  function isTableType(col) { return col.type.endsWith('-table'); }

  /**
   * Entry point. Wires up all static event listeners and kicks off the
   * initial data load from the server via google.script.run.
   */
  function init() {
    document.getElementById('btn-back').addEventListener('click', () => {
      isNewRow = false;
      showView('list');
    });
    document.getElementById('btn-save').addEventListener('click', saveRow);
    document.getElementById('btn-delete').addEventListener('click', deletePerson);
    document.getElementById('lightbox').addEventListener('click', () => {
      document.getElementById('lightbox').style.display = 'none';
    });
    const chkRegex = document.getElementById('chk-regex');
    chkRegex.addEventListener('change', () => {
      useRegex = chkRegex.checked;
      setTimeout(applyFilters, 0);
    });
    const addBtn = document.getElementById('btn-add-person');
    if (addBtn) addBtn.addEventListener('click', addPerson);
    document.getElementById('btn-export-f1').addEventListener('click', () => runExport('btn-export-f1', 'exportF1'));
    document.getElementById('btn-export-wc').addEventListener('click', () => runExport('btn-export-wc', 'exportWC'));
    document.getElementById('btn-export-close').addEventListener('click', () => {
      document.getElementById('export-overlay').style.display = 'none';
    });
    document.getElementById('btn-columns').addEventListener('click', e => {
      e.stopPropagation();
      const panel = document.getElementById('col-panel');
      panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    });
    // Prevent clicks inside the panel from closing it via the document listener below.
    document.getElementById('col-panel').addEventListener('click', e => e.stopPropagation());
    document.addEventListener('click', () => {
      document.getElementById('col-panel').style.display = 'none';
    });

    google.script.run
      .withSuccessHandler(onDataLoaded)
      .withFailureHandler(onLoadError)
      .getSchemaAndData();
  }

  /**
   * Success handler for the initial getSchemaAndData() call.
   * Stores the schema, builds the table header/filter rows, renders data, and
   * corrects sticky header offsets after the table becomes visible.
   * @param {{columns: Object[], rows: Object[]}} data
   */
  function onDataLoaded(data) {
    schema = data;
    document.getElementById('loading').style.display = 'none';
    buildListView();
    applyFilters();
    document.getElementById('data-table').style.display = 'table';
    updateStickyOffsets();
  }

  /**
   * Failure handler for the initial getSchemaAndData() call.
   * Hides the loading indicator and shows the error message in the list view.
   * @param {Error} err
   */
  function onLoadError(err) {
    document.getElementById('loading').style.display = 'none';
    const el = document.getElementById('error-msg');
    el.textContent = `Error loading data: ${err.message || err}`;
    el.style.display = 'block';
  }

  /**
   * Builds the static parts of the list view that depend on schema but not on data:
   * the column header row and the filter input row. Also rebuilds the column
   * visibility panel. Called once after schema is loaded.
   */
  function buildListView() {
    const filterRow = document.getElementById('filter-row');
    const headerRow = document.getElementById('header-row');
    filterRow.innerHTML = '';
    headerRow.innerHTML = '';

    schema.columns.forEach((col, i) => {
      const th = document.createElement('th');
      th.dataset.colIndex = i;
      const hDiv = document.createElement('div');
      hDiv.className = 'cell-content';
      if (col.type === 'image') hDiv.classList.add('cell-content--image');
      if (isTableType(col)) hDiv.classList.add('cell-content--table');
      hDiv.textContent = col.name;
      th.appendChild(hDiv);
      headerRow.appendChild(th);

      const fth = document.createElement('th');
      fth.dataset.colIndex = i;
      const fDiv = document.createElement('div');
      fDiv.className = 'cell-content';
      if (col.type === 'text' || col.type === 'unit' || col.type === 'origin' || col.type === 'date' || col.type === 'tin' || col.type === 'marital-status' || col.type === 'image' || isTableType(col)) {
        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = 'Filter';
        input.dataset.colIndex = i;
        input.addEventListener('input', debounce(applyFilters, schema.filterDebounceMs));
        fDiv.appendChild(input);
      }
      fth.appendChild(fDiv);
      filterRow.appendChild(fth);
    });
    buildColumnPanel();
  }

  /**
   * Reads all active filter inputs, filters schema.rows into filteredRows,
   * and re-renders the table body. Called on every filter input change.
   */
  function applyFilters() {
    const filters = {};
    document.querySelectorAll('#filter-row input[type=text]').forEach(inp => {
      const val = inp.value.trim();
      if (!val) return;
      if (val === '""' || val === "''") {
        filters[inp.dataset.colIndex] = { empty: true };
      } else if (useRegex) {
        try { filters[inp.dataset.colIndex] = new RegExp(val, 'i'); } catch (e) { /* invalid regex — skip */ }
      } else {
        filters[inp.dataset.colIndex] = val.toLowerCase();
      }
    });
    filteredRows = schema.rows.filter(row =>
      Object.keys(filters).every(colIdx => {
        const cell = row.values[colIdx] || '';
        const f = filters[colIdx];
        if (f?.empty) return !cell.trim();
        if (f?.notEmpty) return !!cell.trim();
        return useRegex ? f.test(cell) : cell.toLowerCase().includes(f);
      })
    );

    renderList();
  }

  /**
   * Rebuilds the table body from filteredRows. Each cell is rendered according
   * to its column type: *-table → mini-table, image → thumbnail, col 0 → edit
   * link, otherwise plain text. Applies column visibility and queues image fetches
   * after the DOM is updated.
   */
  function renderList() {
    const tbody = document.getElementById('table-body');
    tbody.innerHTML = '';

    filteredRows.forEach(row => {
      const tr = document.createElement('tr');
      row.values.forEach((val, i) => {
        const td = document.createElement('td');
        td.dataset.colIndex = i;
        const col = schema.columns[i];

        const cell = document.createElement('div');
        cell.className = 'cell-content';

        if (col.type === 'image') cell.classList.add('cell-content--image');
        if (isTableType(col)) {
          cell.classList.add('cell-content--table');
          cell.appendChild(buildMiniTable(parseData(val, col.tableHeaders || []), col.tableHeaders || []));
        } else if (col.type === 'image') {
          const id = extractDriveId(val);
          if (id) {
            const cached = imageCache[id];
            if (cached && cached.type !== 'image') {
              cell.appendChild(buildFileBadge(cached.type, cached.viewUrl));
            } else {
              const img = document.createElement('img');
              img.className = 'thumb';
              img.alt = '';
              if (cached?.type === 'image') {
                img.src = cached.dataUrl;
              } else {
                img.dataset.fileId = id; // picked up by queueImageFetch()
              }
              img.addEventListener('click', () => openLightbox(id));
              cell.appendChild(img);
            }
          } else {
            const span = document.createElement('span');
            span.className = 'no-image';
            span.textContent = '—';
            cell.appendChild(span);
          }
        } else if (i === 0 && schema.editMode) {
          const a = document.createElement('a');
          a.className = 'name-link';
          a.href = '#';
          a.textContent = val;
          a.addEventListener('click', e => {
            e.preventDefault();
            openEditView(row);
          });
          cell.appendChild(a);
        } else {
          cell.textContent = val;
        }

        td.appendChild(cell);
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    applyColumnVisibility();
    queueImageFetch();
  }

  /**
   * Creates a badge element for non-image Drive files (PDF, folder, no-access).
   * @param {string} type - 'pdf' | 'folder' | 'no-access'
   * @param {string} [viewUrl]
   * @returns {HTMLElement}
   */
  function buildFileBadge(type, viewUrl) {
    if (type === 'no-access') {
      const span = document.createElement('span');
      span.className = 'pdf-link pdf-link--no-access';
      span.textContent = 'No access';
      return span;
    }
    const a = document.createElement('a');
    a.href = viewUrl;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.className = 'pdf-link' + (type === 'folder' ? ' pdf-link--folder' : '');
    a.textContent = type === 'folder' ? 'Folder' : 'PDF';
    return a;
  }

  /**
   * Finds all img elements tagged with data-file-id (not yet loaded) and fires
   * one google.script.run call per unique file ID. Results are stored in imageCache
   * and the img src is updated when the response arrives. Uses pendingImages to
   * prevent duplicate in-flight requests for the same file.
   */
  function queueImageFetch() {
    const ids = [];
    document.querySelectorAll('img[data-file-id]').forEach(img => {
      const id = img.dataset.fileId;
      if (!id || pendingImages.has(id)) return;
      pendingImages.add(id);
      ids.push(id);
    });
    if (!ids.length) return;
    const batchSize = schema.imageFetchBatchSize;
    const concurrency = schema.imageFetchConcurrency;
    let offset = 0;
    const fetchNext = () => {
      if (offset >= ids.length) return;
      const batch = ids.slice(offset, offset + batchSize);
      offset += batchSize;
      google.script.run
        .withSuccessHandler(results => {
          batch.forEach(fileId => {
            pendingImages.delete(fileId);
            const result = results[fileId] ?? null;
            imageCache[fileId] = result;
            document.querySelectorAll(`img[data-file-id="${fileId}"]`).forEach(el => {
              el.removeAttribute('data-file-id');
              if (result?.type === 'image') {
                el.src = result.dataUrl;
              } else if (result) {
                el.parentNode.replaceChild(buildFileBadge(result.type, result.viewUrl), el);
              }
            });
          });
          fetchNext();
        })
        .withFailureHandler(() => {
          batch.forEach(fileId => pendingImages.delete(fileId));
          fetchNext();
        })
        .getImagesDataUrls(batch);
    };
    const workers = Math.min(concurrency, Math.ceil(ids.length / batchSize));
    for (let i = 0; i < workers; i++) fetchNext();
  }

  /**
   * Populates the column visibility dropdown panel with a "Select all" checkbox
   * and one checkbox per column. The first column's checkbox is always disabled.
   * Rebuilds the panel from scratch each time schema changes.
   */
  function buildColumnPanel() {
    const panel = document.getElementById('col-panel');
    panel.innerHTML = '';

    const allLabel = document.createElement('label');
    allLabel.style.cssText = 'font-weight:600; padding-bottom:6px; margin-bottom:4px; border-bottom:1px solid #eee;';
    const allCb = document.createElement('input');
    allCb.type = 'checkbox';
    allCb.id = 'col-select-all';
    allCb.addEventListener('change', () => {
      schema.columns.forEach((col, i) => {
        if (i === 0) return;
        if (allCb.checked) hiddenColumns.delete(i);
        else hiddenColumns.add(i);
      });
      panel.querySelectorAll('input[data-cb-col]').forEach(cb => {
        if (parseInt(cb.dataset.cbCol) !== 0) cb.checked = allCb.checked;
      });
      applyColumnVisibility();
    });
    allLabel.appendChild(allCb);
    allLabel.appendChild(document.createTextNode(' Select all'));
    panel.appendChild(allLabel);

    schema.columns.forEach((col, i) => {
      const label = document.createElement('label');
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = !hiddenColumns.has(i);
      cb.dataset.cbCol = i;
      if (i === 0) {
        cb.disabled = true;
      } else {
        cb.addEventListener('change', () => {
          if (cb.checked) hiddenColumns.delete(i);
          else hiddenColumns.add(i);
          updateSelectAll();
          applyColumnVisibility();
        });
      }
      label.appendChild(cb);
      label.appendChild(document.createTextNode(` ${col.name}`));
      panel.appendChild(label);
    });

    updateSelectAll();
  }

  /**
   * Syncs the "Select all" checkbox state (checked / unchecked / indeterminate)
   * to reflect how many non-first columns are currently visible.
   */
  function updateSelectAll() {
    const allCb = document.getElementById('col-select-all');
    if (!allCb || schema.columns.length <= 1) return;
    let hiddenCount = 0;
    schema.columns.forEach((col, i) => {
      if (i !== 0 && hiddenColumns.has(i)) hiddenCount++;
    });
    const total = schema.columns.length - 1;
    if (hiddenCount === 0) {
      allCb.checked = true; allCb.indeterminate = false;
    } else if (hiddenCount === total) {
      allCb.checked = false; allCb.indeterminate = false;
    } else {
      allCb.indeterminate = true;
    }
  }

  /**
   * Shows or hides every th/td in the data table based on the hiddenColumns set.
   * Targets cells by their data-col-index attribute so both header and body stay
   * in sync.
   */
  function applyColumnVisibility() {
    document.querySelectorAll('#data-table th[data-col-index], #data-table td[data-col-index]').forEach(el => {
      el.style.display = hiddenColumns.has(parseInt(el.dataset.colIndex)) ? 'none' : '';
    });
  }

  /**
   * Measures the rendered height of the filter row and sets the CSS top offset
   * of each header-row th so both sticky rows stack correctly without overlapping.
   * Must be called after the table is visible (offsetHeight requires layout).
   */
  function updateStickyOffsets() {
    const filterHeight = document.getElementById('filter-row').getBoundingClientRect().height;
    document.querySelectorAll('#header-row th').forEach(th => {
      th.style.top = `${filterHeight}px`;
    });
  }

  /**
   * Extracts the Google Drive file ID from a sharing URL or returns the input
   * unchanged if it looks like a bare file ID already.
   * Supported formats:
   *   https://drive.google.com/file/d/FILE_ID/view
   *   https://drive.google.com/open?id=FILE_ID
   *   FILE_ID (bare alphanumeric string ≥ 10 chars)
   * @param {string} url
   * @returns {string|null} File ID, or null if not parseable.
   */
  function extractDriveId(url) {
    if (!url) return null;
    const patterns = [
      /\/file\/d\/([a-zA-Z0-9_-]+)/,
      /\/drive\/folders\/([a-zA-Z0-9_-]+)/,
      /[?&]id=([a-zA-Z0-9_-]+)/,
    ];
    for (const pattern of patterns) {
      const m = url.match(pattern);
      if (m) return m[1];
    }
    if (/^[a-zA-Z0-9_-]{10,}$/.test(url.trim())) return url.trim();
    return null;
  }

  /**
   * Opens the lightbox overlay for a given Drive file ID. Uses the cached data
   * URL if available; otherwise fetches it from the server and updates the
   * lightbox image once the response arrives.
   * @param {string} fileId - Google Drive file ID.
   */
  function openLightbox(fileId) {
    const cached = imageCache[fileId];
    if (cached?.type === 'no-access') return;
    if (cached && cached.type !== 'image') {
      window.open(cached.viewUrl, '_blank', 'noopener,noreferrer');
      return;
    }
    const lightbox = document.getElementById('lightbox');
    const imgEl = document.getElementById('lightbox-img');
    const pdfMsg = lightbox.querySelector('.lightbox-pdf-msg');
    lightbox.style.display = 'flex';
    pdfMsg.style.display = 'none';
    imgEl.style.display = '';
    if (cached?.type === 'image') {
      imgEl.src = cached.dataUrl;
    } else {
      imgEl.src = '';
      google.script.run
        .withSuccessHandler(results => {
          const result = results[fileId] ?? null;
          imageCache[fileId] = result;
          if (result?.type === 'image') {
            imgEl.src = result.dataUrl;
          } else if (result?.type === 'no-access') {
            lightbox.style.display = 'none';
          } else if (result) {
            imgEl.style.display = 'none';
            pdfMsg.querySelector('a').href = result.viewUrl;
            pdfMsg.style.display = 'flex';
          }
        })
        .withFailureHandler(() => {})
        .getImagesDataUrls([fileId]);
    }
  }

  /**
   * Switches to the edit view for the given row. Dynamically builds a form field
   * for each column: a table editor for *-table types, a text input with live
   * image preview for image types, and a plain text input for text types.
   * @param {{rowIndex: number, values: string[]}} row
   */
  function openEditView(row) {
    editingRow = row;
    const form = document.getElementById('edit-form');
    form.innerHTML = '';

    schema.columns.forEach((col, i) => {
      const block = document.createElement('div');
      block.className = 'field-block';

      const label = document.createElement('label');
      label.textContent = col.name;
      block.appendChild(label);

      if (isTableType(col)) {
        block.appendChild(buildTableEditor(i, parseData(row.values[i] || '', col.tableHeaders || []), col.tableHeaders || []));
      } else if (col.type === 'unit') {
        const currentVal = row.values[i] || '';
        const sel = document.createElement('select');
        sel.dataset.colIndex = i;
        const emptyOpt = document.createElement('option');
        emptyOpt.value = '';
        emptyOpt.textContent = '—';
        sel.appendChild(emptyOpt);
        (col.unitOptions || []).forEach(opt => {
          const o = document.createElement('option');
          o.value = opt;
          o.textContent = opt;
          sel.appendChild(o);
        });
        if (currentVal && !(col.unitOptions || []).includes(currentVal)) {
          const o = document.createElement('option');
          o.value = currentVal;
          o.textContent = currentVal;
          sel.appendChild(o);
        }
        sel.value = currentVal;
        block.appendChild(sel);
      } else if (col.type === 'origin') {
        const currentVal = row.values[i] || '';
        const sel = document.createElement('select');
        sel.dataset.colIndex = i;
        const emptyOpt = document.createElement('option');
        emptyOpt.value = '';
        emptyOpt.textContent = '—';
        sel.appendChild(emptyOpt);
        (col.originOptions || []).forEach(opt => {
          const o = document.createElement('option');
          o.value = opt;
          o.textContent = opt;
          sel.appendChild(o);
        });
        if (currentVal && !(col.originOptions || []).includes(currentVal)) {
          const o = document.createElement('option');
          o.value = currentVal;
          o.textContent = currentVal;
          sel.appendChild(o);
        }
        sel.value = currentVal;
        block.appendChild(sel);
      } else if (col.type === 'marital-status') {
        const currentVal = row.values[i] || '';
        const sel = document.createElement('select');
        sel.dataset.colIndex = i;
        const emptyOpt = document.createElement('option');
        emptyOpt.value = '';
        emptyOpt.textContent = '—';
        sel.appendChild(emptyOpt);
        (col.maritalStatusOptions || []).forEach(opt => {
          const o = document.createElement('option');
          o.value = opt;
          o.textContent = opt;
          sel.appendChild(o);
        });
        if (currentVal && !(col.maritalStatusOptions || []).includes(currentVal)) {
          const o = document.createElement('option');
          o.value = currentVal;
          o.textContent = currentVal;
          sel.appendChild(o);
        }
        sel.value = currentVal;
        block.appendChild(sel);
      } else if (col.type === 'tin') {
        const input = document.createElement('input');
        input.type = 'text';
        input.value = row.values[i] || '';
        input.dataset.colIndex = i;
        input.placeholder = '1234567890';
        block.appendChild(input);

        const errHint = document.createElement('div');
        errHint.className = 'field-hint field-error';
        errHint.style.display = 'none';
        errHint.textContent = 'Must be exactly 10 digits';
        block.appendChild(errHint);

        input.addEventListener('input', () => {
          const val = input.value.trim();
          const valid = !val || /^\d{10}$/.test(val);
          input.classList.toggle('input-error', !valid);
          errHint.style.display = valid ? 'none' : 'block';
        });
      } else if (col.type === 'date') {
        const input = document.createElement('input');
        input.type = 'text';
        input.value = row.values[i] || '';
        input.dataset.colIndex = i;
        input.placeholder = 'DD.MM.YYYY';
        block.appendChild(input);

        const errHint = document.createElement('div');
        errHint.className = 'field-hint field-error';
        errHint.style.display = 'none';
        errHint.textContent = 'Format: DD.MM.YYYY';
        block.appendChild(errHint);

        input.addEventListener('input', () => {
          const val = input.value.trim();
          const valid = !val || /^\d{2}\.\d{2}\.\d{4}$/.test(val);
          input.classList.toggle('input-error', !valid);
          errHint.style.display = valid ? 'none' : 'block';
        });
      } else {
        const input = document.createElement('input');
        input.type = 'text';
        input.value = row.values[i] || '';
        input.dataset.colIndex = i;
        block.appendChild(input);

        if (col.type === 'image') {
          const hint = document.createElement('div');
          hint.className = 'field-hint';
          hint.textContent = 'Paste a Google Drive sharing link';
          block.appendChild(hint);

          const preview = document.createElement('img');
          preview.className = 'edit-preview';
          preview.alt = '';

          const pdfPreview = document.createElement('div');
          pdfPreview.className = 'edit-preview-pdf';
          pdfPreview.style.display = 'none';
          const pdfA = document.createElement('a');
          pdfA.target = '_blank';
          pdfA.rel = 'noopener noreferrer';
          pdfA.textContent = 'Open PDF in Drive';
          pdfPreview.appendChild(pdfA);

          block.appendChild(preview);
          block.appendChild(pdfPreview);
          updatePreview(preview, pdfPreview, input.value);

          input.addEventListener('input', () => updatePreview(preview, pdfPreview, input.value));
        }
      }

      form.appendChild(block);
    });

    document.getElementById('edit-title').textContent = isNewRow ? '' : (row.values[0] || 'Edit record');
    document.getElementById('save-error').style.display = 'none';
    document.getElementById('save-status').textContent = '';
    document.getElementById('btn-save').disabled = false;
    const deleteBtn = document.getElementById('btn-delete');
    deleteBtn.style.display = isNewRow ? 'none' : 'inline-block';
    deleteBtn.disabled = false;
    showView('edit');
  }

  /**
   * Updates the image preview element in the edit form for an image-type field.
   * Extracts the file ID from the URL, shows a cached data URL immediately if
   * available, or fetches it from the server asynchronously.
   * @param {HTMLImageElement} imgEl - The preview img element to update.
   * @param {HTMLDivElement} pdfEl - The PDF/no-access fallback container.
   * @param {string} url - The Google Drive URL or file ID entered by the user.
   */
  function updatePreview(imgEl, pdfEl, url) {
    const id = extractDriveId(url);
    if (!id) {
      imgEl.src = ''; imgEl.style.display = 'none';
      pdfEl.style.display = 'none';
      return;
    }
    const cached = imageCache[id];
    if (cached) {
      if (cached.type === 'image') {
        pdfEl.style.display = 'none';
        imgEl.style.display = 'block';
        imgEl.src = cached.dataUrl;
      } else if (cached.type === 'no-access') {
        imgEl.src = ''; imgEl.style.display = 'none';
        const link = pdfEl.querySelector('a');
        link.removeAttribute('href');
        link.textContent = 'No access to this file';
        pdfEl.style.display = 'block';
      } else {
        imgEl.src = ''; imgEl.style.display = 'none';
        const link = pdfEl.querySelector('a');
        link.href = cached.viewUrl;
        link.textContent = cached.type === 'folder' ? 'Open Folder in Drive' : 'Open PDF in Drive';
        pdfEl.style.display = 'block';
      }
      return;
    }
    imgEl.src = ''; imgEl.style.display = 'block';
    pdfEl.style.display = 'none';
    google.script.run
      .withSuccessHandler(results => {
        const result = results[id] ?? null;
        imageCache[id] = result;
        if (result?.type === 'image') {
          imgEl.src = result.dataUrl;
          imgEl.style.display = 'block';
          pdfEl.style.display = 'none';
        } else if (result?.type === 'no-access') {
          imgEl.src = ''; imgEl.style.display = 'none';
          const link = pdfEl.querySelector('a');
          link.removeAttribute('href');
          link.textContent = 'No access to this file';
          pdfEl.style.display = 'block';
        } else if (result) {
          imgEl.src = ''; imgEl.style.display = 'none';
          const link = pdfEl.querySelector('a');
          link.href = result.viewUrl;
          link.textContent = result.type === 'folder' ? 'Open Folder in Drive' : 'Open PDF in Drive';
          pdfEl.style.display = 'block';
        } else {
          imgEl.style.display = 'none';
        }
      })
      .withFailureHandler(() => { imgEl.style.display = 'none'; })
      .getImagesDataUrls([id]);
  }

  /**
   * Builds a read-only HTML table element from decoded *-table row data.
   * Used to display *-table column values in the list view.
   * @param {Object[]} rows - Array of row objects (field name → value).
   * @param {string[]} headers - Ordered sub-column header names.
   * @returns {HTMLTableElement}
   */
  function buildMiniTable(rows, headers) {
    const table = document.createElement('table');
    table.className = 'mini-table';
    const thead = document.createElement('thead');
    const trHead = document.createElement('tr');
    (headers || []).forEach(h => {
      const th = document.createElement('th');
      th.textContent = h;
      trHead.appendChild(th);
    });
    thead.appendChild(trHead);
    table.appendChild(thead);
    const tbody = document.createElement('tbody');
    (rows || []).forEach(rowObj => {
      const tr = document.createElement('tr');
      (headers || []).forEach(h => {
        const td = document.createElement('td');
        td.textContent = rowObj[h] || '';
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    return table;
  }

  /**
   * Builds an interactive table editor widget for a *-table column in the edit
   * view. Pre-populates rows from decoded data. Includes an "Add row" button and
   * a delete button per row. The wrapper div carries data-col-index so
   * encodeTableEditor() can locate it during save.
   * @param {number} colIndex - Index of the column in schema.columns.
   * @param {Object[]} rows - Pre-decoded row objects.
   * @param {string[]} headers - Sub-column header names.
   * @returns {HTMLDivElement}
   */
  function buildTableEditor(colIndex, rows, headers) {
    const wrapper = document.createElement('div');
    wrapper.className = 'table-editor';
    wrapper.dataset.colIndex = colIndex;
    const table = document.createElement('table');
    const thead = document.createElement('thead');
    const trHead = document.createElement('tr');
    (headers || []).forEach(h => {
      const th = document.createElement('th');
      th.textContent = h;
      trHead.appendChild(th);
    });
    trHead.appendChild(document.createElement('th')); // placeholder for delete column
    thead.appendChild(trHead);
    table.appendChild(thead);
    const tbody = document.createElement('tbody');
    (rows || []).forEach(rowObj => addTableEditorRow(tbody, headers, rowObj));
    table.appendChild(tbody);
    wrapper.appendChild(table);
    const btnAdd = document.createElement('button');
    btnAdd.type = 'button';
    btnAdd.className = 'btn-add-row';
    btnAdd.textContent = '+ Add row';
    btnAdd.addEventListener('click', () => addTableEditorRow(tbody, headers, null));
    wrapper.appendChild(btnAdd);
    return wrapper;
  }

  /**
   * Appends a new editable row to a table editor tbody. Each cell contains a
   * text input tagged with data-field (the header name). The last cell contains
   * a delete button that removes the row from the DOM.
   * @param {HTMLTableSectionElement} tbody
   * @param {string[]} headers - Sub-column header names.
   * @param {Object|null} rowObj - Existing row data to pre-fill, or null for an empty row.
   */
  function addTableEditorRow(tbody, headers, rowObj) {
    const tr = document.createElement('tr');
    (headers || []).forEach(h => {
      const td = document.createElement('td');
      const inp = document.createElement('input');
      inp.type = 'text';
      inp.value = rowObj?.[h] ?? '';
      inp.dataset.field = h;
      td.appendChild(inp);
      tr.appendChild(td);
    });
    const tdDel = document.createElement('td');
    const btnDel = document.createElement('button');
    btnDel.type = 'button';
    btnDel.className = 'btn-delete-row';
    btnDel.textContent = '×';
    btnDel.addEventListener('click', () => tr.remove());
    tdDel.appendChild(btnDel);
    tr.appendChild(tdDel);
    tbody.appendChild(tr);
  }

  /**
   * Reads all input values from a table editor widget and encodes them back into
   * the pipe-delimited cell string using mergeData(). Rows where the first field
   * is empty are excluded (treated as blank/deleted).
   * @param {number} colIndex - Index of the column whose editor to read.
   * @param {{tableHeaders: string[]}} col - Column descriptor from schema.
   * @returns {string} Encoded cell value ready to write to the sheet.
   */
  function encodeTableEditor(colIndex, col) {
    const wrapper = document.querySelector(`.table-editor[data-col-index="${colIndex}"]`);
    if (!wrapper) return '';
    const rows = [];
    wrapper.querySelectorAll('tbody tr').forEach(tr => {
      const obj = {};
      tr.querySelectorAll('input[data-field]').forEach(inp => {
        obj[inp.dataset.field] = inp.value;
      });
      rows.push(obj);
    });
    return mergeData(rows, col.tableHeaders || [], (col.tableHeaders || [])[0] || '');
  }

  /**
   * Collects new values for all columns from the edit form (plain inputs and table
   * editors), stores them in pendingValues, and calls updateRow() on the server.
   * Disables the Save button for the duration of the async call.
   */
  function saveRow() {
    let hasDateError = false;
    schema.columns.forEach((col, i) => {
      if (col.type !== 'date') return;
      const inp = document.querySelector(`#edit-form input[data-col-index="${i}"]`);
      if (!inp) return;
      const val = inp.value.trim();
      const valid = !val || /^\d{2}\.\d{2}\.\d{4}$/.test(val);
      inp.classList.toggle('input-error', !valid);
      if (!valid) hasDateError = true;
    });
    if (hasDateError) {
      const el = document.getElementById('save-error');
      el.textContent = 'Fix date fields (expected format: DD.MM.YYYY) before saving.';
      el.style.display = 'block';
      return;
    }

    let hasTinError = false;
    schema.columns.forEach((col, i) => {
      if (col.type !== 'tin') return;
      const inp = document.querySelector(`#edit-form input[data-col-index="${i}"]`);
      if (!inp) return;
      const val = inp.value.trim();
      const valid = !val || /^\d{10}$/.test(val);
      inp.classList.toggle('input-error', !valid);
      if (!valid) hasTinError = true;
    });
    if (hasTinError) {
      const el = document.getElementById('save-error');
      el.textContent = 'TIN must be exactly 10 digits.';
      el.style.display = 'block';
      return;
    }

    const newValues = new Array(schema.columns.length).fill('');
    document.querySelectorAll('#edit-form input[data-col-index]').forEach(inp => {
      newValues[parseInt(inp.dataset.colIndex)] = inp.value;
    });
    document.querySelectorAll('#edit-form select[data-col-index]').forEach(sel => {
      newValues[parseInt(sel.dataset.colIndex)] = sel.value;
    });
    schema.columns.forEach((col, i) => {
      if (isTableType(col)) newValues[i] = encodeTableEditor(i, col);
    });
    pendingValues = newValues;

    document.getElementById('btn-save').disabled = true;
    document.getElementById('save-status').textContent = 'Saving…';
    document.getElementById('save-error').style.display = 'none';

    google.script.run
      .withSuccessHandler(onSaveSuccess)
      .withFailureHandler(onSaveError)
      .updateRow(editingRow.rowIndex, newValues);
  }

  /**
   * Success handler for saveRow(). Updates the in-memory row values from
   * pendingValues so the list view reflects the change without a full reload,
   * then returns to the list view. For new rows, adds the row to schema.rows.
   */
  function onSaveSuccess() {
    if (pendingValues) {
      pendingValues.forEach((val, i) => { editingRow.values[i] = val; });
      pendingValues = null;
    }
    if (isNewRow) {
      schema.rows.push(editingRow);
      isNewRow = false;
    }
    applyFilters();
    showView('list');
  }

  /**
   * Appends a new empty row to the sheet via the server, then opens the edit
   * view for it. The row is added to schema.rows only after a successful save.
   */
  function addPerson() {
    const btn = document.getElementById('btn-add-person');
    btn.disabled = true;
    google.script.run
      .withSuccessHandler(newRowIndex => {
        const emptyValues = new Array(schema.columns.length).fill('');
        const newRow = { rowIndex: newRowIndex, values: emptyValues };
        isNewRow = true;
        openEditView(newRow);
        btn.disabled = false;
      })
      .withFailureHandler(err => {
        btn.disabled = false;
        alert(`Failed to add person: ${err.message || err}`);
      })
      .addRow();
  }

  /**
   * Failure handler for saveRow(). Re-enables the Save button and displays
   * the error message inside the edit view.
   * @param {Error} err
   */
  function onSaveError(err) {
    document.getElementById('btn-save').disabled = false;
    document.getElementById('save-status').textContent = '';
    const el = document.getElementById('save-error');
    el.textContent = `Save failed: ${err.message || err}`;
    el.style.display = 'block';
  }

  /**
   * Asks for confirmation then moves the current row to the Trash sheet via the server.
   */
  function deletePerson() {
    if (!confirm('Move this person to Trash?')) return;
    document.getElementById('btn-delete').disabled = true;
    document.getElementById('btn-save').disabled = true;
    document.getElementById('save-error').style.display = 'none';
    google.script.run
      .withSuccessHandler(onDeleteSuccess)
      .withFailureHandler(onDeleteError)
      .deleteRow(editingRow.rowIndex);
  }

  /**
   * Success handler for deletePerson(). Removes the row from the in-memory schema,
   * adjusts rowIndexes for all subsequent rows (the sheet row numbers shifted up by 1),
   * and returns to the list view.
   */
  function onDeleteSuccess() {
    const deletedIndex = editingRow.rowIndex;
    schema.rows = schema.rows.filter(r => r !== editingRow);
    schema.rows.forEach(r => {
      if (r.rowIndex > deletedIndex) r.rowIndex--;
    });
    editingRow = null;
    applyFilters();
    showView('list');
  }

  /**
   * Failure handler for deletePerson(). Re-enables buttons and shows the error.
   * @param {Error} err
   */
  function onDeleteError(err) {
    document.getElementById('btn-delete').disabled = false;
    document.getElementById('btn-save').disabled = false;
    const el = document.getElementById('save-error');
    el.textContent = `Delete failed: ${err.message || err}`;
    el.style.display = 'block';
  }

  /**
   * Switches between the list view and the edit view by toggling display styles.
   * The list view uses display:flex (it is a flex column layout); the edit view
   * uses display:block.
   * @param {'list'|'edit'} name
   */
  function showView(name) {
    document.getElementById('view-list').style.display = name === 'list' ? 'flex' : 'none';
    document.getElementById('view-edit').style.display = name === 'edit' ? 'block' : 'none';
  }

  /**
   * Exports documents for every currently visible (filtered) row using the
   * given server-side function. Automatically continues in subsequent batches
   * if the server hits its time limit before finishing all rows.
   * @param {string} btnId - ID of the button that triggered the export (disabled for the full run).
   * @param {string} serverFnName - Name of the Apps Script function to call ('exportF1' or 'exportWC').
   */
  function runExport(btnId, serverFnName) {
    if (!filteredRows || filteredRows.length === 0) {
      alert('No visible rows to export. Adjust your filters and try again.');
      return;
    }

    const total = filteredRows.length;
    const btn = document.getElementById(btnId);
    const ul = document.getElementById('export-links');

    document.getElementById('export-msg').textContent = `Exporting ${total} document${total !== 1 ? 's' : ''}…`;
    ul.style.display = 'none';
    ul.innerHTML = '';
    document.getElementById('export-error').style.display = 'none';
    document.getElementById('btn-export-close').style.display = 'none';
    document.getElementById('export-progress-wrap').style.display = 'block';
    document.getElementById('export-overlay').style.display = 'flex';
    btn.disabled = true;

    let doneCount = 0;
    const progressBar = document.getElementById('export-progress-bar');

    const setProgress = pct => {
      progressBar.classList.remove('indeterminate');
      progressBar.style.width = `${pct}%`;
    };

    const fire = indices => {
      progressBar.classList.add('indeterminate');
      google.script.run
        .withSuccessHandler(response => {
          response.results.forEach(r => {
            const li = document.createElement('li');
            const a = document.createElement('a');
            a.href = r.url;
            a.target = '_blank';
            a.textContent = r.name;
            li.appendChild(a);
            ul.appendChild(li);
          });
          ul.style.display = 'block';
          doneCount += response.results.length;
          setProgress(Math.round(doneCount / total * 100));

          if (response.remaining.length > 0) {
            document.getElementById('export-msg').textContent =
              `Exported ${doneCount} of ${total}, continuing…`;
            fire(response.remaining);
          } else {
            btn.disabled = false;
            document.getElementById('export-msg').textContent =
              `Exported ${doneCount} document${doneCount !== 1 ? 's' : ''}:`;
            document.getElementById('btn-export-close').style.display = 'inline-block';
          }
        })
        .withFailureHandler(err => {
          btn.disabled = false;
          progressBar.classList.remove('indeterminate');
          document.getElementById('export-msg').textContent =
            doneCount > 0 ? `Exported ${doneCount} before error:` : '';
          const el = document.getElementById('export-error');
          el.textContent = `Export failed: ${err.message || err}`;
          el.style.display = 'block';
          document.getElementById('btn-export-close').style.display = 'inline-block';
        })
        [serverFnName](indices);
    };

    fire(filteredRows.map(r => r.rowIndex));
  }

  document.addEventListener('DOMContentLoaded', init);
</script>
