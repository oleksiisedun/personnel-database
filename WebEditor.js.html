<script>
  google.script.host.setWidth(screen.availWidth);
  google.script.host.setHeight(screen.availHeight);

  let schema = null;       // { columns: [{name, type, tableHeaders?}], rows: [{rowIndex, values[]}] }
  let filteredRows = [];   // subset of schema.rows currently shown after filters
  let editingRow = null;   // row object open in the edit view
  let pendingValues = null; // newValues[] staged by saveRow(), consumed by onSaveSuccess()
  let hiddenColumns = new Set(); // column indices hidden by the user
  let imageCache = {};     // fileId → { type:'image', dataUrl } | { type:'pdf', viewUrl } | null
  let pendingImages = new Set(); // fileIds currently being fetched to avoid duplicate requests
  let isNewRow = false;    // true when the edit view holds a freshly appended row
  let useRegex = false;              // true when filter inputs are treated as regular expressions
  let filterActualPersonnel = false; // true when only names in the actual personnel list are shown
  let showAllUnits = true;           // true when master-mode remote rows are included alongside local ones
  let dbPromise = null;              // Promise<IDBDatabase> — opened once in init(), reused thereafter
  let pendingMoveEntries = null;     // rowEntries[] sent to movePersonnel(), consumed by onMoveSuccess()
  let pendingExportState = null;     // { btnId, serverFnName, entries } staged when confirm dialog is shown
  const selectedKeys = new Set(); // compound "spreadsheetId:rowIndex" keys of rows checked for export

  /**
   * Returns a stable unique key for a row, combining spreadsheetId and rowIndex.
   * Local rows (no spreadsheetId) use an empty string prefix.
   * @param {{rowIndex: number, spreadsheetId?: string}} row
   * @returns {string}
   */
  const rowKey = row => `${row.spreadsheetId ?? ''}:${row.rowIndex}`;

  const FIELD_SEP = ' | ';
  const ROW_SEP = '\n';

  /**
   * Returns a debounced version of fn that fires only after delay ms of silence.
   * @param {Function} fn
   * @param {number} delay - Milliseconds to wait after the last call.
   * @returns {Function}
   */
  function debounce(fn, delay) {
    let timer;
    return () => { clearTimeout(timer); timer = setTimeout(fn, delay); };
  }

  /**
   * Opens (or reuses) the IndexedDB database for the persistent image cache.
   * Called eagerly in init() so the DB is ready before onDataLoaded fires.
   * @returns {Promise<IDBDatabase>}
   */
  function openImageDB() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      try {
        const req = indexedDB.open('pdb_images', 1);
        req.onupgradeneeded = e => { e.target.result.createObjectStore('images'); };
        req.onsuccess = e => resolve(e.target.result);
        req.onerror = () => reject(req.error);
      } catch (e) {
        reject(e);
      }
    });
    return dbPromise;
  }

  /**
   * Reads all entries from IndexedDB, validates TTL, and pre-populates imageCache
   * so renderList() can display cached images without queuing network requests.
   * Expired or invalid entries are deleted in the same pass. Always resolves.
   * @returns {Promise<void>}
   */
  async function loadCacheFromIndexedDB() {
    try {
      const db = await openImageDB();
      const ttlMs = schema.imageCacheTtlDays * 24 * 60 * 60 * 1000;
      const now = Date.now();
      await new Promise(resolve => {
        const req = db.transaction('images', 'readwrite').objectStore('images').openCursor();
        req.onsuccess = e => {
          const cursor = e.target.result;
          if (!cursor) { resolve(); return; }
          const entry = cursor.value;
          if (!entry?.data || now - entry.savedAt > ttlMs) {
            cursor.delete();
          } else {
            imageCache[cursor.key] = entry.data;
          }
          cursor.continue();
        };
        req.onerror = () => resolve();
      });
    } catch (e) {
      // IndexedDB unavailable — silent fallback, images fetched from server
    }
  }

  /**
   * Persists a single fetched image result to IndexedDB. Fire-and-forget.
   * @param {string} fileId - Google Drive file ID used as the record key.
   * @param {Object} result - Value returned by getImagesDataUrls for this file ID.
   * @returns {void}
   */
  function saveToIndexedDB(fileId, result) {
    openImageDB().then(db => {
      db.transaction('images', 'readwrite').objectStore('images')
        .put({ savedAt: Date.now(), data: result }, fileId);
    }).catch(() => {});
  }

  /**
   * Decodes a pipe-delimited cell string into an array of row objects.
   * Empty cell returns []. Each row object maps field names to string values.
   * @param {string} cell - Raw encoded cell value from the sheet.
   * @param {string[]} fields - Ordered list of field names (sub-column headers).
   * @returns {Object[]}
   */
  const parseData = (cell, fields) => {
    if (!cell) return [];
    return cell.split(ROW_SEP).map(row => {
      const values = row.split(FIELD_SEP);
      return Object.fromEntries(fields.map((key, i) => [key, values[i] ?? '']));
    });
  };

  /**
   * Encodes an array of row objects back into the pipe-delimited cell string.
   * Rows where the first field (filterKey) is empty are excluded.
   * @param {Object[]} data - Array of row objects.
   * @param {string[]} fields - Ordered list of field names.
   * @param {string} filterKey - Field name used to filter out blank rows.
   * @returns {string}
   */
  const mergeData = (data, fields, filterKey) => data
    .filter(r => r[filterKey])
    .map(r => fields.map(f => r[f] ?? '').join(FIELD_SEP))
    .join(ROW_SEP);

  /**
   * Returns true if the column type is a *-table type (e.g. relatives-table).
   * @param {{type: string}} col
   * @returns {boolean}
   */
  function isTableType(col) { return col.type.endsWith('-table'); }

  /**
   * Validation rules for column types that have format constraints. Defined at
   * module scope so both real-time input handlers and saveRow() share the same regex.
   */
  const VALIDATORS = {
    date: { regex: /^\d{2}\.\d{2}\.\d{4}$/, placeholder: 'DD.MM.YYYY',  hint: 'Format: DD.MM.YYYY',        msg: 'Fix date fields (expected format: DD.MM.YYYY) before saving.' },
    tin:  { regex: /^\d{10}$/,               placeholder: '1234567890',  hint: 'Must be exactly 10 digits', msg: 'TIN must be exactly 10 digits.' },
  };

  /**
   * Sets the text of an error element and makes it visible.
   * @param {string} elementId - ID of the error display element.
   * @param {string} prefix - Message prefix, e.g. "Save failed".
   * @param {Error|string} err - Error object or message string.
   */
  function showError(elementId, prefix, err) {
    const el = document.getElementById(elementId);
    el.textContent = `${prefix}: ${err.message || err}`;
    el.style.display = 'block';
  }

  /**
   * Builds a text input with live validation against VALIDATORS[col.type].
   * @param {{type: string}} col
   * @param {string} value
   * @param {number} colIndex
   * @returns {{ input: HTMLInputElement, errHint: HTMLElement }}
   */
  function buildValidatedInput(col, value, colIndex) {
    const v = VALIDATORS[col.type];
    const input = document.createElement('input');
    input.type = 'text';
    input.value = value;
    input.dataset.colIndex = colIndex;
    input.placeholder = v.placeholder;
    const errHint = document.createElement('div');
    errHint.className = 'field-hint field-error';
    errHint.style.display = 'none';
    errHint.textContent = v.hint;
    input.addEventListener('input', () => {
      const val = input.value.trim();
      const valid = !val || v.regex.test(val);
      input.classList.toggle('input-error', !valid);
      errHint.style.display = valid ? 'none' : 'block';
    });
    return { input, errHint };
  }

  /**
   * Builds a <colgroup> element with proportional widths for a *-table column.
   * Column widths are proportional to the square root of the max content length
   * (header or any data value, minimum 8 chars). Returns null when headers is empty.
   * @param {Object[]} rows - Decoded table row objects.
   * @param {string[]} headers - Sub-column header names.
   * @param {boolean} [extraCol=false] - When true, appends an unsized <col> for the delete button column.
   * @returns {HTMLTableColElement|null}
   */
  function buildTableColgroup(rows, headers, extraCol = false) {
    if (!(headers || []).length) return null;
    const scaledLens = headers.map(h => {
      const dataMax = (rows || []).reduce((m, r) => Math.max(m, (r[h] || '').length), 0);
      return Math.sqrt(Math.max(h.length, dataMax, 8));
    });
    const total = scaledLens.reduce((a, b) => a + b, 0);
    const colgroup = document.createElement('colgroup');
    scaledLens.forEach(len => {
      const col = document.createElement('col');
      col.style.width = `${(len / total * 100).toFixed(1)}%`;
      colgroup.appendChild(col);
    });
    if (extraCol) colgroup.appendChild(document.createElement('col'));
    return colgroup;
  }

  /**
   * Builds a <thead> element with a single header row populated from the given headers.
   * @param {string[]} headers - Sub-column header names.
   * @param {boolean} [extraTh=false] - When true, appends an empty <th> for the delete button column.
   * @returns {HTMLTableSectionElement}
   */
  function buildTableHeaderRow(headers, extraTh = false) {
    const thead = document.createElement('thead');
    const trHead = document.createElement('tr');
    (headers || []).forEach(h => {
      const th = document.createElement('th');
      th.textContent = h;
      trHead.appendChild(th);
    });
    if (extraTh) trHead.appendChild(document.createElement('th'));
    thead.appendChild(trHead);
    return thead;
  }

  /**
   * Groups row indexes from a list of row entries by source spreadsheetId.
   * Used to build the argument for adjustRowIndexesAfterDelete().
   * @param {Array<{rowIndex: number, spreadsheetId: string|null}>} entries
   * @returns {Map<string|null, number[]>}
   */
  function groupRowIndexesBySource(entries) {
    const bySource = new Map();
    entries.forEach(({ rowIndex, spreadsheetId }) => {
      const key = spreadsheetId ?? null;
      if (!bySource.has(key)) bySource.set(key, []);
      bySource.get(key).push(rowIndex);
    });
    return bySource;
  }

  /**
   * Decrements the cached rowIndex of remaining rows in schema.rows when one or
   * more rows have been hard-deleted from a source sheet. Rows above the deletion
   * point in the same spreadsheet have their sheet row numbers shifted up by one
   * per deletion, so the cached indexes must be adjusted to match the new reality.
   * @param {Map<string|null, number[]>} deletedBySource - Map of spreadsheetId (null=local)
   *   to the array of deleted rowIndexes within that spreadsheet.
   */
  function adjustRowIndexesAfterDelete(deletedBySource) {
    schema.rows.forEach(r => {
      const deletedIndexes = deletedBySource.get(r.spreadsheetId ?? null);
      if (!deletedIndexes) return;
      r.rowIndex -= deletedIndexes.filter(idx => idx < r.rowIndex).length;
    });
  }

  /**
   * Entry point. Wires up all static event listeners and kicks off the
   * initial data load from the server via google.script.run.
   */
  function init() {
    document.getElementById('btn-back').addEventListener('click', () => {
      isNewRow = false;
      showView('list');
    });
    document.getElementById('btn-save').addEventListener('click', saveRow);
    document.getElementById('btn-delete').addEventListener('click', deletePerson);
    document.getElementById('lightbox').addEventListener('click', () => {
      document.getElementById('lightbox').style.display = 'none';
    });
    const chkRegex = document.getElementById('chk-regex');
    chkRegex.addEventListener('change', () => {
      useRegex = chkRegex.checked;
      setTimeout(applyFilters, 0);
    });
    const addBtn = document.getElementById('btn-add-person');
    if (addBtn) addBtn.addEventListener('click', addPerson);
    document.getElementById('btn-export-f1').addEventListener('click', () => runExport('btn-export-f1', 'exportF1'));
    document.getElementById('btn-export-wc').addEventListener('click', () => runExport('btn-export-wc', 'exportWC'));
    document.getElementById('btn-export-close').addEventListener('click', () => {
      document.getElementById('export-overlay').style.display = 'none';
    });
    document.getElementById('btn-export-cancel').addEventListener('click', () => {
      if (pendingExportState) {
        document.getElementById(pendingExportState.btnId).disabled = false;
        pendingExportState = null;
      }
      document.getElementById('export-overlay').style.display = 'none';
    });
    document.getElementById('btn-export-proceed').addEventListener('click', () => {
      if (!pendingExportState) return;
      const { btnId, serverFnName, entries, total } = pendingExportState;
      pendingExportState = null;
      document.getElementById('export-confirm-wrap').style.display = 'none';
      startExportProgress(btnId, serverFnName, entries, total);
    });
    document.getElementById('btn-schema-warning').addEventListener('click', openSchemaWarningOverlay);
    document.getElementById('btn-schema-warning-close').addEventListener('click', closeSchemaWarningOverlay);
    document.getElementById('btn-move').addEventListener('click', openMoveOverlay);
    document.getElementById('btn-move-cancel').addEventListener('click', closeMoveOverlay);
    document.getElementById('btn-move-confirm').addEventListener('click', runMove);
    document.getElementById('btn-delete-bulk').addEventListener('click', deletePersonnelBulk);
    document.getElementById('btn-columns').addEventListener('click', e => {
      e.stopPropagation();
      const panel = document.getElementById('col-panel');
      panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    });
    // Prevent clicks inside the panel from closing it via the document listener below.
    document.getElementById('col-panel').addEventListener('click', e => e.stopPropagation());
    document.addEventListener('click', () => {
      document.getElementById('col-panel').style.display = 'none';
    });

    openImageDB(); // start DB open in parallel with getSchemaAndData
    google.script.run
      .withSuccessHandler(onDataLoaded)
      .withFailureHandler(onLoadError)
      .getSchemaAndData();
  }

  /**
   * Success handler for the initial getSchemaAndData() call.
   * Awaits the IndexedDB cache load so renderList() can display cached images
   * immediately, then builds and shows the table.
   * @param {{columns: Object[], rows: Object[]}} data
   * @returns {Promise<void>}
   */
  async function onDataLoaded(data) {
    schema = data;
    schema.sourceColumnMismatches = {};
    await loadCacheFromIndexedDB();
    document.getElementById('loading').style.display = 'none';
    if (data.masterMode) {
      document.getElementById('btn-move').style.display = '';
      document.getElementById('all-units-label').style.display = '';
      const chkAllUnits = document.getElementById('chk-all-units');
      chkAllUnits.addEventListener('change', () => {
        showAllUnits = chkAllUnits.checked;
        const table = document.getElementById('data-table');
        table.classList.add('filtering');
        requestAnimationFrame(() => requestAnimationFrame(() => {
          applyFilters();
          table.classList.remove('filtering');
        }));
      });
    }
    const chkActual = document.getElementById('chk-actual');
    if (data.actualPersonnelNames?.length) {
      schema.actualPersonnelNamesSet = new Set(data.actualPersonnelNames.map(n => n.trim()));
      chkActual.disabled = false;
      chkActual.addEventListener('change', () => {
        filterActualPersonnel = chkActual.checked;
        const table = document.getElementById('data-table');
        table.classList.add('filtering');
        requestAnimationFrame(() => requestAnimationFrame(() => {
          applyFilters();
          table.classList.remove('filtering');
        }));
      });
    }
    buildListView();
    applyFilters();
    document.getElementById('data-table').style.display = 'table';
    updateStickyOffsets();
    if (data.masterMode && data.masterSourceIds?.length) queueMasterSourceFetch();
  }

  /**
   * Failure handler for the initial getSchemaAndData() call.
   * Hides the loading indicator and shows the error message in the list view.
   * @param {Error} err
   */
  function onLoadError(err) {
    document.getElementById('loading').style.display = 'none';
    showError('error-msg', 'Error loading data', err);
  }

  /**
   * Builds the static parts of the list view that depend on schema but not on data:
   * the column header row and the filter input row. Also rebuilds the column
   * visibility panel. Called once after schema is loaded.
   */
  function buildListView() {
    const filterRow = document.getElementById('filter-row');
    const headerRow = document.getElementById('header-row');
    const dataTable = document.getElementById('data-table');
    const debouncedFilter = debounce(() => {
      applyFilters();
      dataTable.classList.remove('filtering');
    }, schema.filterDebounceMs);
    filterRow.innerHTML = '';
    headerRow.innerHTML = '';

    // Checkbox column — filter row: master select-all checkbox
    const fthCb = document.createElement('th');
    fthCb.className = 'col-checkbox';
    const chkAll = document.createElement('input');
    chkAll.type = 'checkbox';
    chkAll.id = 'chk-select-all';
    chkAll.title = 'Select / deselect all visible';
    chkAll.addEventListener('change', () => {
      filteredRows.forEach(row => {
        if (chkAll.checked) selectedKeys.add(rowKey(row));
        else selectedKeys.delete(rowKey(row));
      });
      document.querySelectorAll('#table-body input[type=checkbox]').forEach(cb => {
        cb.checked = chkAll.checked;
      });
      updateSelectionUI();
    });
    fthCb.appendChild(chkAll);
    filterRow.appendChild(fthCb);

    // Checkbox column — header row: empty label cell
    const thCb = document.createElement('th');
    thCb.className = 'col-checkbox';
    headerRow.appendChild(thCb);

    schema.columns.forEach((col, i) => {
      const th = document.createElement('th');
      th.dataset.colIndex = i;
      const hDiv = document.createElement('div');
      hDiv.className = 'cell-content';
      if (col.type === 'image') hDiv.classList.add('cell-content--image');
      if (isTableType(col)) hDiv.classList.add('cell-content--table');
      hDiv.textContent = col.name;
      th.appendChild(hDiv);
      headerRow.appendChild(th);

      const fth = document.createElement('th');
      fth.dataset.colIndex = i;
      const fDiv = document.createElement('div');
      fDiv.className = 'cell-content';
      const input = document.createElement('input');
      input.type = 'text';
      input.placeholder = 'Filter';
      input.dataset.colIndex = i;
      input.addEventListener('input', () => dataTable.classList.add('filtering'));
      input.addEventListener('input', debouncedFilter);
      fDiv.appendChild(input);
      fth.appendChild(fDiv);
      filterRow.appendChild(fth);
    });
    buildColumnPanel();
  }

  /**
   * Reads all active filter inputs, filters schema.rows into filteredRows,
   * and re-renders the table body. Called on every filter input change.
   */
  function applyFilters() {
    const filters = {};
    document.querySelectorAll('#filter-row input[type=text]').forEach(inp => {
      const val = inp.value.trim();
      if (!val) return;
      if (val === '""' || val === "''") {
        filters[inp.dataset.colIndex] = { empty: true };
      } else if (useRegex) {
        try { filters[inp.dataset.colIndex] = new RegExp(val, 'i'); } catch (e) { /* invalid regex — skip */ }
      } else {
        filters[inp.dataset.colIndex] = val.toLowerCase();
      }
    });
    filteredRows = schema.rows.filter(row => {
      if (!Object.keys(filters).every(colIdx => {
        const cell = row.values[colIdx] || '';
        const f = filters[colIdx];
        if (f?.empty) return !cell.trim();
        if (f?.notEmpty) return !!cell.trim();
        return useRegex ? f.test(cell) : cell.toLowerCase().includes(f);
      })) return false;
      if (!showAllUnits && row.spreadsheetId) return false;
      if (filterActualPersonnel) {
        return schema.actualPersonnelNamesSet.has((row.values[0] ?? '').trim());
      }
      return true;
    });

    if (schema.masterSourceIds?.length) {
      const srcOrder = new Map([[undefined, 0], [null, 0]]);
      schema.masterSourceIds.forEach((id, i) => srcOrder.set(id, i + 1));
      filteredRows.sort((a, b) => {
        const ao = srcOrder.get(a.spreadsheetId) ?? srcOrder.size;
        const bo = srcOrder.get(b.spreadsheetId) ?? srcOrder.size;
        return ao !== bo ? ao - bo : a.rowIndex - b.rowIndex;
      });
    }

    renderList();
  }

  /**
   * Rebuilds the table body from filteredRows. Each cell is rendered according
   * to its column type: *-table → mini-table, image → thumbnail, col 0 → edit
   * link, otherwise plain text. Applies column visibility and queues image fetches
   * after the DOM is updated.
   */
  function renderList() {
    const tbody = document.getElementById('table-body');
    tbody.innerHTML = '';

    filteredRows.forEach(row => {
      const tr = document.createElement('tr');

      const tdCb = document.createElement('td');
      tdCb.className = 'col-checkbox';
      const chk = document.createElement('input');
      chk.type = 'checkbox';
      chk.checked = selectedKeys.has(rowKey(row));
      chk.addEventListener('change', () => {
        if (chk.checked) selectedKeys.add(rowKey(row));
        else selectedKeys.delete(rowKey(row));
        updateSelectionUI();
      });
      tdCb.appendChild(chk);
      tr.appendChild(tdCb);

      row.values.forEach((val, i) => {
        const td = document.createElement('td');
        td.dataset.colIndex = i;
        const col = schema.columns[i];

        const cell = document.createElement('div');
        cell.className = 'cell-content';

        if (col.type === 'image') cell.classList.add('cell-content--image');
        if (isTableType(col)) {
          cell.classList.add('cell-content--table');
          cell.appendChild(buildMiniTable(parseData(val, col.tableHeaders || []), col.tableHeaders || []));
        } else if (col.type === 'image') {
          const id = extractDriveId(val);
          if (id) {
            const cached = imageCache[id];
            if (cached && cached.type !== 'image') {
              cell.appendChild(buildFileBadge(cached.type, cached.viewUrl));
            } else {
              const img = document.createElement('img');
              img.className = 'thumb';
              img.alt = '';
              if (cached?.type === 'image') {
                img.src = cached.dataUrl;
              } else {
                img.dataset.fileId = id; // picked up by queueImageFetch()
              }
              img.addEventListener('click', () => openLightbox(id));
              cell.appendChild(img);
            }
          } else {
            const span = document.createElement('span');
            span.className = 'no-image';
            span.textContent = '—';
            cell.appendChild(span);
          }
        } else if (i === 0) {
          const a = document.createElement('a');
          a.className = 'name-link';
          a.href = '#';
          a.textContent = val;
          a.addEventListener('click', e => {
            e.preventDefault();
            openEditView(row);
          });
          cell.appendChild(a);
        } else {
          cell.textContent = val;
        }

        td.appendChild(cell);
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    applyColumnVisibility();
    queueImageFetch();
    updateSelectionUI();
  }

  /**
   * Updates export button disabled state and the master checkbox
   * (checked / indeterminate / unchecked) to reflect current selection vs visible rows.
   */
  function updateSelectionUI() {
    const selectedInView = filteredRows.filter(r => selectedKeys.has(rowKey(r))).length;
    document.getElementById('btn-export-f1').disabled = selectedInView === 0;
    document.getElementById('btn-export-wc').disabled = selectedInView === 0;
    document.getElementById('btn-move').disabled = selectedInView === 0;
    document.getElementById('btn-delete-bulk').disabled = selectedInView === 0;

    const chkAll = document.getElementById('chk-select-all');
    if (!chkAll) return;
    const total = filteredRows.length;
    if (total === 0 || selectedInView === 0) {
      chkAll.checked = false;
      chkAll.indeterminate = false;
    } else if (selectedInView === total) {
      chkAll.checked = true;
      chkAll.indeterminate = false;
    } else {
      chkAll.checked = false;
      chkAll.indeterminate = true;
    }
  }

  /**
   * Creates a badge element for non-image Drive files (PDF, folder, no-access).
   * @param {string} type - 'pdf' | 'folder' | 'no-access'
   * @param {string} [viewUrl]
   * @returns {HTMLElement}
   */
  function buildFileBadge(type, viewUrl) {
    if (type === 'no-access') {
      const span = document.createElement('span');
      span.className = 'pdf-link pdf-link--no-access';
      span.textContent = 'No access';
      return span;
    }
    const a = document.createElement('a');
    a.href = viewUrl;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.className = 'pdf-link' + (type === 'folder' ? ' pdf-link--folder' : '');
    a.textContent = type === 'folder' ? 'Folder' : 'PDF';
    return a;
  }

  /**
   * Finds all img elements tagged with data-file-id (not yet loaded) and fires
   * one google.script.run call per unique file ID. Results are stored in imageCache
   * and the img src is updated when the response arrives. Uses pendingImages to
   * prevent duplicate in-flight requests for the same file.
   */
  function queueImageFetch() {
    const ids = [];
    document.querySelectorAll('img[data-file-id]').forEach(img => {
      const id = img.dataset.fileId;
      if (!id || pendingImages.has(id)) return;
      pendingImages.add(id);
      ids.push(id);
    });
    if (!ids.length) return;
    const batchSize = schema.imageFetchBatchSize;
    const concurrency = schema.imageFetchConcurrency;
    let offset = 0;
    const fetchNext = () => {
      if (offset >= ids.length) return;
      const batch = ids.slice(offset, offset + batchSize);
      offset += batchSize;
      google.script.run
        .withSuccessHandler(results => {
          batch.forEach(fileId => {
            pendingImages.delete(fileId);
            const result = results[fileId] ?? null;
            imageCache[fileId] = result;
            saveToIndexedDB(fileId, result);
            document.querySelectorAll(`img[data-file-id="${fileId}"]`).forEach(el => {
              el.removeAttribute('data-file-id');
              if (result?.type === 'image') {
                el.src = result.dataUrl;
              } else if (result) {
                el.parentNode.replaceChild(buildFileBadge(result.type, result.viewUrl), el);
              }
            });
          });
          fetchNext();
        })
        .withFailureHandler(() => {
          batch.forEach(fileId => pendingImages.delete(fileId));
          fetchNext();
        })
        .getImagesDataUrls(batch);
    };
    const workers = Math.min(concurrency, Math.ceil(ids.length / batchSize));
    for (let i = 0; i < workers; i++) fetchNext();
  }

  /**
   * Streams in additional Master Mode source spreadsheets' rows after the
   * initial (local-only) render, via a worker pool over getMasterSourceRows()
   * (mirrors queueImageFetch()'s concurrency pattern). Newly-arrived rows and
   * source names are merged into schema and the list is silently re-filtered;
   * inaccessible sources are skipped, same as the previous synchronous loop.
   */
  function queueMasterSourceFetch() {
    const ids = schema.masterSourceIds.slice();
    const concurrency = schema.masterModeFetchConcurrency;
    const debouncedApplyFilters = debounce(applyFilters, schema.filterDebounceMs);
    let offset = 0;
    const fetchNext = () => {
      if (offset >= ids.length) return;
      const id = ids[offset++];
      google.script.run
        .withSuccessHandler(result => {
          if (result.columnMismatches?.length) {
            schema.sourceColumnMismatches[result.id] = result.columnMismatches;
          } else {
            schema.rows.push(...result.rows);
          }
          schema.masterSources.push({ id: result.id, name: result.name });
          updateSchemaWarningIcon();
          debouncedApplyFilters();
          fetchNext();
        })
        .withFailureHandler(() => {
          updateSchemaWarningIcon();
          fetchNext();
        })
        .getMasterSourceRows(id);
    };
    const workers = Math.min(concurrency, ids.length);
    for (let i = 0; i < workers; i++) fetchNext();
  }

  /**
   * Converts a 0-based column index to a spreadsheet letter (A, B, …, Z, AA, …).
   * @param {number} index
   * @returns {string}
   */
  function colIndexToLetter(index) {
    let letter = '';
    let n = index + 1;
    while (n > 0) {
      const rem = (n - 1) % 26;
      letter = String.fromCharCode(65 + rem) + letter;
      n = Math.floor((n - 1) / 26);
    }
    return letter;
  }

  /**
   * Shows or hides the schema-warning button based on recorded column mismatches.
   */
  function updateSchemaWarningIcon() {
    const btn = document.getElementById('btn-schema-warning');
    if (!btn) return;
    btn.style.display = Object.keys(schema.sourceColumnMismatches).length ? '' : 'none';
  }

  /**
   * Populates and opens the schema-warning overlay. Rebuilds content each time
   * so freshly-arrived mismatches are always reflected.
   */
  function openSchemaWarningOverlay() {
    const sourceMap = new Map(schema.masterSources.map(s => [s.id, s.name]));
    const content = document.getElementById('schema-warning-content');
    content.textContent = '';
    for (const [id, mismatches] of Object.entries(schema.sourceColumnMismatches)) {
      const heading = document.createElement('h3');
      heading.textContent = sourceMap.get(id) ?? id;
      content.appendChild(heading);
      const table = document.createElement('table');
      const hRow = table.createTHead().insertRow();
      ['Column', 'Local', 'Remote'].forEach(text => {
        const th = document.createElement('th');
        th.textContent = text;
        hRow.appendChild(th);
      });
      const tbody = table.createTBody();
      mismatches.forEach(({ colIndex, localName, remoteName }) => {
        const tr = tbody.insertRow();
        [colIndexToLetter(colIndex), localName, remoteName].forEach(text => {
          tr.insertCell().textContent = text;
        });
      });
      content.appendChild(table);
    }
    document.getElementById('schema-warning-overlay').style.display = 'flex';
  }

  /**
   * Closes the schema-warning overlay.
   */
  function closeSchemaWarningOverlay() {
    document.getElementById('schema-warning-overlay').style.display = 'none';
  }

  /**
   * Populates the column visibility dropdown panel with a "Select all" checkbox
   * and one checkbox per column. The first column's checkbox is always disabled.
   * Rebuilds the panel from scratch each time schema changes.
   */
  function buildColumnPanel() {
    const panel = document.getElementById('col-panel');
    panel.innerHTML = '';

    const allLabel = document.createElement('label');
    allLabel.style.cssText = 'font-weight:600; padding-bottom:6px; margin-bottom:4px; border-bottom:1px solid #eee;';
    const allCb = document.createElement('input');
    allCb.type = 'checkbox';
    allCb.id = 'col-select-all';
    allCb.addEventListener('change', () => {
      schema.columns.forEach((col, i) => {
        if (i === 0) return;
        if (allCb.checked) hiddenColumns.delete(i);
        else hiddenColumns.add(i);
      });
      panel.querySelectorAll('input[data-cb-col]').forEach(cb => {
        if (parseInt(cb.dataset.cbCol) !== 0) cb.checked = allCb.checked;
      });
      applyColumnVisibility();
    });
    allLabel.appendChild(allCb);
    allLabel.appendChild(document.createTextNode(' Select all'));
    panel.appendChild(allLabel);

    schema.columns.forEach((col, i) => {
      const label = document.createElement('label');
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = !hiddenColumns.has(i);
      cb.dataset.cbCol = i;
      if (i === 0) {
        cb.disabled = true;
      } else {
        cb.addEventListener('change', () => {
          if (cb.checked) hiddenColumns.delete(i);
          else hiddenColumns.add(i);
          updateSelectAll();
          applyColumnVisibility();
        });
      }
      label.appendChild(cb);
      label.appendChild(document.createTextNode(` ${col.name}`));
      panel.appendChild(label);
    });

    updateSelectAll();
  }

  /**
   * Syncs the "Select all" checkbox state (checked / unchecked / indeterminate)
   * to reflect how many non-first columns are currently visible.
   */
  function updateSelectAll() {
    const allCb = document.getElementById('col-select-all');
    if (!allCb || schema.columns.length <= 1) return;
    let hiddenCount = 0;
    schema.columns.forEach((col, i) => {
      if (i !== 0 && hiddenColumns.has(i)) hiddenCount++;
    });
    const total = schema.columns.length - 1;
    if (hiddenCount === 0) {
      allCb.checked = true; allCb.indeterminate = false;
    } else if (hiddenCount === total) {
      allCb.checked = false; allCb.indeterminate = false;
    } else {
      allCb.indeterminate = true;
    }
  }

  /**
   * Shows or hides every th/td in the data table based on the hiddenColumns set.
   * Targets cells by their data-col-index attribute so both header and body stay
   * in sync.
   */
  function applyColumnVisibility() {
    document.querySelectorAll('#data-table th[data-col-index], #data-table td[data-col-index]').forEach(el => {
      el.style.display = hiddenColumns.has(parseInt(el.dataset.colIndex)) ? 'none' : '';
    });
  }

  /**
   * Measures the rendered height of the filter row and sets the CSS top offset
   * of each header-row th so both sticky rows stack correctly without overlapping.
   * Must be called after the table is visible (offsetHeight requires layout).
   */
  function updateStickyOffsets() {
    const filterHeight = document.getElementById('filter-row').getBoundingClientRect().height;
    document.querySelectorAll('#header-row th').forEach(th => {
      th.style.top = `${filterHeight}px`;
    });
  }

  /**
   * Extracts the Google Drive file ID from a sharing URL or returns the input
   * unchanged if it looks like a bare file ID already.
   * Supported formats:
   *   https://drive.google.com/file/d/FILE_ID/view
   *   https://drive.google.com/drive/u/0/folders/FOLDER_ID (or without the /u/0/ account segment)
   *   https://drive.google.com/open?id=FILE_ID
   *   FILE_ID (bare alphanumeric string ≥ 10 chars)
   * Server-side counterpart: parseDriveId() in Code.js — keep URL patterns aligned.
   * @param {string} url
   * @returns {string|null} File ID, or null if not parseable.
   */
  function extractDriveId(url) {
    if (!url) return null;
    const patterns = [
      /\/folders\/([a-zA-Z0-9_-]+)/,
      /\/d\/([a-zA-Z0-9_-]+)/,
      /[?&]id=([a-zA-Z0-9_-]+)/,
    ];
    for (const pattern of patterns) {
      const m = url.match(pattern);
      if (m) return m[1];
    }
    if (/^[a-zA-Z0-9_-]{10,}$/.test(url.trim())) return url.trim();
    return null;
  }

  /**
   * Applies a server file-fetch result to an image/PDF preview pair.
   * @param {HTMLImageElement} imgEl
   * @param {HTMLElement} pdfEl - Container with an <a> child for non-image files.
   * @param {{type: string, dataUrl?: string, viewUrl?: string}|null} result
   */
  function applyFileResult(imgEl, pdfEl, result) {
    if (!result) { imgEl.style.display = 'none'; return; }
    if (result.type === 'image') {
      imgEl.src = result.dataUrl;
      imgEl.style.display = 'block';
      pdfEl.style.display = 'none';
    } else {
      imgEl.src = '';
      imgEl.style.display = 'none';
      const link = pdfEl.querySelector('a');
      if (result.type === 'no-access') {
        link.removeAttribute('href');
        link.textContent = 'No access to this file';
      } else {
        link.href = result.viewUrl;
        link.textContent = result.type === 'folder' ? 'Open Folder in Drive' : 'Open PDF in Drive';
      }
      pdfEl.style.display = 'block';
    }
  }

  /**
   * Opens the lightbox overlay for a given Drive file ID. Uses the cached data
   * URL if available; otherwise fetches it from the server and updates the
   * lightbox image once the response arrives.
   * @param {string} fileId - Google Drive file ID.
   */
  function openLightbox(fileId) {
    const cached = imageCache[fileId];
    if (cached?.type === 'no-access') return;
    if (cached && cached.type !== 'image') {
      window.open(cached.viewUrl, '_blank', 'noopener,noreferrer');
      return;
    }
    const lightbox = document.getElementById('lightbox');
    const imgEl = document.getElementById('lightbox-img');
    const pdfMsg = lightbox.querySelector('.lightbox-pdf-msg');
    lightbox.style.display = 'flex';
    pdfMsg.style.display = 'none';
    imgEl.style.display = '';
    if (cached?.type === 'image') {
      imgEl.src = cached.dataUrl;
    } else {
      imgEl.src = '';
      google.script.run
        .withSuccessHandler(results => {
          const result = results[fileId] ?? null;
          imageCache[fileId] = result;
          saveToIndexedDB(fileId, result);
          if (result?.type === 'image') {
            imgEl.src = result.dataUrl;
          } else if (result?.type === 'no-access') {
            lightbox.style.display = 'none';
          } else if (result) {
            imgEl.style.display = 'none';
            pdfMsg.querySelector('a').href = result.viewUrl;
            pdfMsg.style.display = 'flex';
          }
        })
        .withFailureHandler(() => {})
        .getImagesDataUrls([fileId]);
    }
  }

  /**
   * Builds a <select> element for a dropdown column type (unit, origin, marital-status, sex).
   * Appends all known options plus the current value if it is not already in the list.
   * @param {{type: string, [key: string]: string[]}} col - Column descriptor with XyzOptions array.
   * @param {number} colIndex - Column index used as the select's data-col-index attribute.
   * @param {string} currentVal - The row's current value for this column.
   * @returns {HTMLSelectElement}
   */
  function buildDropdownField(col, colIndex, currentVal) {
    const optKey = col.type === 'marital-status' ? 'maritalStatusOptions' : col.type + 'Options';
    const options = col[optKey] || [];
    const sel = document.createElement('select');
    sel.dataset.colIndex = colIndex;
    const emptyOpt = document.createElement('option');
    emptyOpt.value = '';
    emptyOpt.textContent = '—';
    sel.appendChild(emptyOpt);
    options.forEach(opt => {
      const o = document.createElement('option');
      o.value = opt;
      o.textContent = opt;
      sel.appendChild(o);
    });
    if (currentVal && !options.includes(currentVal)) {
      const o = document.createElement('option');
      o.value = currentVal;
      o.textContent = currentVal;
      sel.appendChild(o);
    }
    sel.value = currentVal;
    return sel;
  }

  /**
   * Switches to the edit view for the given row. Dynamically builds a form field
   * for each column: a dropdown for dropdown types, a table editor for *-table types,
   * a text input with live image preview for image types, and a plain text input for text types.
   * @param {{rowIndex: number|null, values: string[]}} row
   */
  function openEditView(row) {
    editingRow = row;
    const form = document.getElementById('edit-form');
    form.innerHTML = '';

    schema.columns.forEach((col, i) => {
      const block = document.createElement('div');
      block.className = 'field-block';

      const label = document.createElement('label');
      label.textContent = col.name;
      block.appendChild(label);

      if (isTableType(col)) {
        block.classList.add('field-block--full');
        block.appendChild(buildTableEditor(i, parseData(row.values[i] || '', col.tableHeaders || []), col.tableHeaders || []));
      } else if (col.type === 'unit' || col.type === 'origin' || col.type === 'marital-status' || col.type === 'sex') {
        block.appendChild(buildDropdownField(col, i, row.values[i] || ''));
      } else if (VALIDATORS[col.type]) {
        const { input, errHint } = buildValidatedInput(col, row.values[i] || '', i);
        block.appendChild(input);
        block.appendChild(errHint);
      } else {
        const input = document.createElement('input');
        input.type = 'text';
        input.value = row.values[i] || '';
        input.dataset.colIndex = i;
        block.appendChild(input);

        if (col.type === 'image') {
          const hint = document.createElement('div');
          hint.className = 'field-hint';
          hint.textContent = 'Paste a Google Drive sharing link';
          block.appendChild(hint);

          const preview = document.createElement('img');
          preview.className = 'edit-preview';
          preview.alt = '';

          const pdfPreview = document.createElement('div');
          pdfPreview.className = 'edit-preview-pdf';
          pdfPreview.style.display = 'none';
          const pdfA = document.createElement('a');
          pdfA.target = '_blank';
          pdfA.rel = 'noopener noreferrer';
          pdfA.textContent = 'Open PDF in Drive';
          pdfPreview.appendChild(pdfA);

          block.appendChild(preview);
          block.appendChild(pdfPreview);
          updatePreview(preview, pdfPreview, input.value);

          input.addEventListener('input', () => updatePreview(preview, pdfPreview, input.value));
        }
      }

      form.appendChild(block);
    });

    document.getElementById('edit-title').textContent = isNewRow ? '' : (row.values[0] || 'Edit record');
    document.getElementById('save-error').style.display = 'none';
    document.getElementById('save-status').textContent = '';
    document.getElementById('btn-save').disabled = false;
    const deleteBtn = document.getElementById('btn-delete');
    deleteBtn.style.display = isNewRow ? 'none' : 'inline-block';
    deleteBtn.disabled = false;
    const ssSelect = document.getElementById('add-spreadsheet-select');
    if (isNewRow && schema.masterMode && showAllUnits) {
      ssSelect.innerHTML = '';
      (schema.masterSources ?? []).forEach(({ id, name }) => {
        const opt = document.createElement('option');
        opt.value = id ?? '';
        opt.textContent = name;
        ssSelect.appendChild(opt);
      });
      ssSelect.style.display = 'inline-block';
    } else {
      ssSelect.style.display = 'none';
    }
    showView('edit');
  }

  /**
   * Updates the image preview element in the edit form for an image-type field.
   * Extracts the file ID from the URL, shows a cached data URL immediately if
   * available, or fetches it from the server asynchronously.
   * @param {HTMLImageElement} imgEl - The preview img element to update.
   * @param {HTMLDivElement} pdfEl - The PDF/no-access fallback container.
   * @param {string} url - The Google Drive URL or file ID entered by the user.
   */
  function updatePreview(imgEl, pdfEl, url) {
    const id = extractDriveId(url);
    if (!id) {
      imgEl.src = ''; imgEl.style.display = 'none';
      pdfEl.style.display = 'none';
      return;
    }
    const cached = imageCache[id];
    if (cached) {
      applyFileResult(imgEl, pdfEl, cached);
      return;
    }
    imgEl.src = ''; imgEl.style.display = 'block';
    pdfEl.style.display = 'none';
    google.script.run
      .withSuccessHandler(results => {
        const result = results[id] ?? null;
        imageCache[id] = result;
        saveToIndexedDB(id, result);
        applyFileResult(imgEl, pdfEl, result);
      })
      .withFailureHandler(() => { imgEl.style.display = 'none'; })
      .getImagesDataUrls([id]);
  }

  /**
   * Builds a read-only HTML table element from decoded *-table row data.
   * Used to display *-table column values in the list view.
   * @param {Object[]} rows - Array of row objects (field name → value).
   * @param {string[]} headers - Ordered sub-column header names.
   * @returns {HTMLTableElement}
   */
  function buildMiniTable(rows, headers) {
    const table = document.createElement('table');
    table.className = 'mini-table';
    const colgroup = buildTableColgroup(rows, headers);
    if (colgroup) table.appendChild(colgroup);
    table.appendChild(buildTableHeaderRow(headers));
    const tbody = document.createElement('tbody');
    (rows || []).forEach(rowObj => {
      const tr = document.createElement('tr');
      (headers || []).forEach(h => {
        const td = document.createElement('td');
        td.textContent = rowObj[h] || '';
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    return table;
  }

  /**
   * Builds an interactive table editor widget for a *-table column in the edit
   * view. Pre-populates rows from decoded data. Includes an "Add row" button and
   * a delete button per row. The wrapper div carries data-col-index so
   * encodeTableEditor() can locate it during save.
   * @param {number} colIndex - Index of the column in schema.columns.
   * @param {Object[]} rows - Pre-decoded row objects.
   * @param {string[]} headers - Sub-column header names.
   * @returns {HTMLDivElement}
   */
  function buildTableEditor(colIndex, rows, headers) {
    const wrapper = document.createElement('div');
    wrapper.className = 'table-editor';
    wrapper.dataset.colIndex = colIndex;
    const table = document.createElement('table');

    const colgroup = buildTableColgroup(rows, headers, true);
    if (colgroup) table.appendChild(colgroup);
    table.appendChild(buildTableHeaderRow(headers, true));
    const tbody = document.createElement('tbody');
    (rows || []).forEach(rowObj => addTableEditorRow(tbody, headers, rowObj));
    table.appendChild(tbody);
    wrapper.appendChild(table);
    const btnAdd = document.createElement('button');
    btnAdd.type = 'button';
    btnAdd.className = 'btn-add-row';
    btnAdd.textContent = '+ Add row';
    btnAdd.addEventListener('click', () => addTableEditorRow(tbody, headers, null));
    wrapper.appendChild(btnAdd);
    return wrapper;
  }

  /**
   * Appends a new editable row to a table editor tbody. Each cell contains a
   * text input tagged with data-field (the header name). The last cell contains
   * a delete button that removes the row from the DOM.
   * @param {HTMLTableSectionElement} tbody
   * @param {string[]} headers - Sub-column header names.
   * @param {Object|null} rowObj - Existing row data to pre-fill, or null for an empty row.
   */
  function addTableEditorRow(tbody, headers, rowObj) {
    const tr = document.createElement('tr');
    (headers || []).forEach(h => {
      const td = document.createElement('td');
      const inp = document.createElement('input');
      inp.type = 'text';
      inp.value = rowObj?.[h] ?? '';
      inp.dataset.field = h;
      td.appendChild(inp);
      tr.appendChild(td);
    });
    const tdDel = document.createElement('td');
    const btnDel = document.createElement('button');
    btnDel.type = 'button';
    btnDel.className = 'btn-delete-row';
    btnDel.textContent = '×';
    btnDel.addEventListener('click', () => tr.remove());
    tdDel.appendChild(btnDel);
    tr.appendChild(tdDel);
    tbody.appendChild(tr);
  }

  /**
   * Reads all input values from a table editor widget and encodes them back into
   * the pipe-delimited cell string using mergeData(). Rows where the first field
   * is empty are excluded (treated as blank/deleted).
   * @param {number} colIndex - Index of the column whose editor to read.
   * @param {{tableHeaders: string[]}} col - Column descriptor from schema.
   * @returns {string} Encoded cell value ready to write to the sheet.
   */
  function encodeTableEditor(colIndex, col) {
    const wrapper = document.querySelector(`.table-editor[data-col-index="${colIndex}"]`);
    if (!wrapper) return '';
    const rows = [];
    wrapper.querySelectorAll('tbody tr').forEach(tr => {
      const obj = {};
      tr.querySelectorAll('input[data-field]').forEach(inp => {
        obj[inp.dataset.field] = inp.value;
      });
      rows.push(obj);
    });
    return mergeData(rows, col.tableHeaders || [], (col.tableHeaders || [])[0] || '');
  }

  /**
   * Collects new values for all columns from the edit form (plain inputs and table
   * editors), stores them in pendingValues, and calls updateRow() on the server.
   * Disables the Save button for the duration of the async call.
   */
  function saveRow() {
    let validationError = null;
    schema.columns.forEach((col, i) => {
      const validator = VALIDATORS[col.type];
      if (!validator) return;
      const inp = document.querySelector(`#edit-form input[data-col-index="${i}"]`);
      if (!inp) return;
      const val = inp.value.trim();
      const valid = !val || validator.regex.test(val);
      inp.classList.toggle('input-error', !valid);
      if (!valid && !validationError) validationError = validator.msg;
    });
    if (validationError) {
      const el = document.getElementById('save-error');
      el.textContent = validationError;
      el.style.display = 'block';
      return;
    }

    const newValues = new Array(schema.columns.length).fill('');
    document.querySelectorAll('#edit-form input[data-col-index]').forEach(inp => {
      newValues[parseInt(inp.dataset.colIndex)] = inp.value;
    });
    document.querySelectorAll('#edit-form select[data-col-index]').forEach(sel => {
      newValues[parseInt(sel.dataset.colIndex)] = sel.value;
    });
    schema.columns.forEach((col, i) => {
      if (isTableType(col)) newValues[i] = encodeTableEditor(i, col);
    });
    pendingValues = newValues;

    document.getElementById('btn-save').disabled = true;
    document.getElementById('save-status').textContent = 'Saving…';
    document.getElementById('save-error').style.display = 'none';

    if (isNewRow) {
      const ssSelect = document.getElementById('add-spreadsheet-select');
      const targetId = (schema.masterMode && showAllUnits && ssSelect.style.display !== 'none')
        ? ssSelect.value || null
        : null;
      google.script.run
        .withSuccessHandler(newRowIndex => {
          editingRow.rowIndex = newRowIndex;
          if (targetId) editingRow.spreadsheetId = targetId;
          onSaveSuccess();
        })
        .withFailureHandler(onSaveError)
        .addRowWithData(newValues, targetId);
    } else {
      google.script.run
        .withSuccessHandler(onSaveSuccess)
        .withFailureHandler(onSaveError)
        .updateRow(editingRow.rowIndex, newValues, editingRow.spreadsheetId ?? null);
    }
  }

  /**
   * Success handler for saveRow(). Updates the in-memory row values from
   * pendingValues so the list view reflects the change without a full reload,
   * then returns to the list view. For new rows, adds the row to schema.rows.
   */
  function onSaveSuccess() {
    if (pendingValues) {
      pendingValues.forEach((val, i) => { editingRow.values[i] = val; });
      pendingValues = null;
    }
    if (isNewRow) {
      schema.rows.push(editingRow);
      isNewRow = false;
    }
    applyFilters();
    showView('list');
  }

  /**
   * Creates a local empty row and opens the edit view for it.
   * The row is written to the sheet only when the user saves.
   */
  function addPerson() {
    const emptyValues = new Array(schema.columns.length).fill('');
    const newRow = { rowIndex: null, values: emptyValues };
    isNewRow = true;
    openEditView(newRow);
  }

  /**
   * Failure handler for saveRow(). Re-enables the Save button and displays
   * the error message inside the edit view.
   * @param {Error} err
   */
  function onSaveError(err) {
    document.getElementById('btn-save').disabled = false;
    document.getElementById('save-status').textContent = '';
    showError('save-error', 'Save failed', err);
  }

  /**
   * Asks for confirmation then moves the current row to the Trash sheet via the server.
   */
  function deletePerson() {
    if (!confirm('Move this person to Trash?')) return;
    document.getElementById('btn-delete').disabled = true;
    document.getElementById('btn-save').disabled = true;
    document.getElementById('save-error').style.display = 'none';
    google.script.run
      .withSuccessHandler(onDeleteSuccess)
      .withFailureHandler(onDeleteError)
      .deleteRow(editingRow.rowIndex, editingRow.spreadsheetId ?? null);
  }

  /**
   * Success handler for deletePerson(). Removes the row from the in-memory schema,
   * adjusts rowIndexes for all subsequent rows (the sheet row numbers shifted up by 1),
   * and returns to the list view.
   */
  function onDeleteSuccess() {
    const deletedIndex = editingRow.rowIndex;
    const deletedSpreadsheetId = editingRow.spreadsheetId ?? null;
    schema.rows = schema.rows.filter(r => r !== editingRow);
    adjustRowIndexesAfterDelete(new Map([[deletedSpreadsheetId, [deletedIndex]]]));
    editingRow = null;
    applyFilters();
    showView('list');
  }

  /**
   * Failure handler for deletePerson(). Re-enables buttons and shows the error.
   * @param {Error} err
   */
  function onDeleteError(err) {
    document.getElementById('btn-delete').disabled = false;
    document.getElementById('btn-save').disabled = false;
    showError('save-error', 'Delete failed', err);
  }

  /**
   * Asks for confirmation then moves all selected rows to Trash via the server.
   */
  function deletePersonnelBulk() {
    const rowEntries = filteredRows
      .filter(r => selectedKeys.has(rowKey(r)))
      .map(r => ({ rowIndex: r.rowIndex, spreadsheetId: r.spreadsheetId ?? null }));
    if (!rowEntries.length) return;
    const count = rowEntries.length;
    if (!confirm(`Move ${count} person${count !== 1 ? 's' : ''} to Trash?`)) return;
    document.getElementById('btn-delete-bulk').disabled = true;
    google.script.run
      .withSuccessHandler(onBulkDeleteSuccess.bind(null, rowEntries))
      .withFailureHandler(onBulkDeleteError)
      .deleteRows(rowEntries);
  }

  /**
   * Success handler for deletePersonnelBulk(). Removes deleted rows from schema,
   * adjusts rowIndexes for remaining rows in the same spreadsheet, and re-renders.
   * @param {Array<{rowIndex: number, spreadsheetId: string|null}>} deletedEntries
   */
  function onBulkDeleteSuccess(deletedEntries) {
    const deletedKeys = new Set(deletedEntries.map(e => rowKey(e)));
    schema.rows = schema.rows.filter(r => !deletedKeys.has(rowKey(r)));
    deletedKeys.forEach(k => selectedKeys.delete(k));

    adjustRowIndexesAfterDelete(groupRowIndexesBySource(deletedEntries));

    applyFilters();
  }

  /**
   * Failure handler for deletePersonnelBulk(). Re-enables the button and logs the error.
   * @param {Error} err
   */
  function onBulkDeleteError(err) {
    document.getElementById('btn-delete-bulk').disabled = false;
    console.error('Bulk delete failed:', err.message || err);
  }

  /**
   * Switches between the list view and the edit view by toggling display styles.
   * The list view uses display:flex (it is a flex column layout); the edit view
   * uses display:block.
   * @param {'list'|'edit'} name
   */
  function showView(name) {
    document.getElementById('view-list').style.display = name === 'list' ? 'flex' : 'none';
    document.getElementById('view-edit').style.display = name === 'edit' ? 'block' : 'none';
  }

  /**
   * Exports documents for every currently visible (filtered) row using the
   * given server-side function. Automatically continues in subsequent batches
   * if the server hits its time limit before finishing all rows.
   * @param {string} btnId - ID of the button that triggered the export (disabled for the full run).
   * @param {string} serverFnName - Name of the Apps Script function to call ('exportF1' or 'exportWC').
   */
  function runExport(btnId, serverFnName) {
    const rowsToExport = filteredRows.filter(r => selectedKeys.has(rowKey(r)));
    if (!rowsToExport.length) return; // safety guard — buttons should already be disabled

    const total = rowsToExport.length;
    const entries = rowsToExport.map(r => ({ rowIndex: r.rowIndex, spreadsheetId: r.spreadsheetId ?? null }));
    const btn = document.getElementById(btnId);
    btn.disabled = true;

    if (total > schema.exportConfirmThreshold) {
      pendingExportState = { btnId, serverFnName, entries, total };
      const estSecs = total * schema.exportSecondsPerDoc;
      const estStr = estSecs < 90
        ? `about ${Math.round(estSecs / 10) * 10} seconds`
        : `about ${Math.round(estSecs / 60)} minutes`;
      document.getElementById('export-confirm-msg').textContent =
        `You are about to export ${total} documents. Export cannot be cancelled once started.`;
      document.getElementById('export-confirm-estimate').textContent = `Estimated time: ${estStr}.`;
      document.getElementById('export-confirm-wrap').style.display = 'block';
      document.getElementById('export-progress-wrap').style.display = 'none';
      document.getElementById('export-msg').textContent = '';
      document.getElementById('export-links').style.display = 'none';
      document.getElementById('export-error').style.display = 'none';
      document.getElementById('btn-export-close').style.display = 'none';
      document.getElementById('export-overlay').style.display = 'flex';
      return;
    }

    startExportProgress(btnId, serverFnName, entries, total);
  }

  /**
   * Resets the export overlay to its progress state and begins the export.
   * @param {string} btnId
   * @param {string} serverFnName
   * @param {Array<{rowIndex: number, spreadsheetId: string|null}>} entries
   * @param {number} total
   */
  function startExportProgress(btnId, serverFnName, entries, total) {
    const btn = document.getElementById(btnId);
    const ul = document.getElementById('export-links');

    document.getElementById('export-confirm-wrap').style.display = 'none';
    document.getElementById('export-msg').textContent = `Exporting ${total} document${total !== 1 ? 's' : ''}…`;
    ul.style.display = 'none';
    ul.innerHTML = '';
    document.getElementById('export-error').style.display = 'none';
    document.getElementById('btn-export-close').style.display = 'none';
    document.getElementById('export-progress-wrap').style.display = 'block';
    document.getElementById('export-overlay').style.display = 'flex';

    let doneCount = 0;
    const progressBar = document.getElementById('export-progress-bar');

    const setProgress = pct => {
      progressBar.classList.remove('indeterminate');
      progressBar.style.width = `${pct}%`;
    };

    const fire = batch => {
      progressBar.classList.add('indeterminate');
      google.script.run
        .withSuccessHandler(response => {
          response.results.forEach(r => {
            const li = document.createElement('li');
            const a = document.createElement('a');
            a.href = r.url;
            a.target = '_blank';
            a.textContent = r.name;
            li.appendChild(a);
            ul.appendChild(li);
          });
          ul.style.display = 'block';
          doneCount += response.results.length;
          setProgress(Math.round(doneCount / total * 100));

          if (response.remaining.length > 0) {
            document.getElementById('export-msg').textContent =
              `Exported ${doneCount} of ${total}, continuing…`;
            fire(response.remaining);
          } else {
            btn.disabled = false;
            document.getElementById('export-msg').textContent =
              `Exported ${doneCount} document${doneCount !== 1 ? 's' : ''}:`;
            document.getElementById('btn-export-close').style.display = 'inline-block';
          }
        })
        .withFailureHandler(err => {
          btn.disabled = false;
          progressBar.classList.remove('indeterminate');
          document.getElementById('export-msg').textContent =
            doneCount > 0 ? `Exported ${doneCount} before error:` : '';
          showError('export-error', 'Export failed', err);
          document.getElementById('btn-export-close').style.display = 'inline-block';
        })
        [serverFnName](batch);
    };

    fire(entries);
  }

  /**
   * Opens the move overlay and populates the destination dropdown.
   * Excludes the shared source of all selected rows from the dropdown so
   * users cannot move persons to the spreadsheet they already belong to
   * (only when all selected rows share the same source).
   */
  function openMoveOverlay() {
    const sources = schema.masterSources ?? [];
    const selectedRows = filteredRows.filter(r => selectedKeys.has(rowKey(r)));

    // Determine if all selected rows share one source (may be null for local).
    const sourceIds = new Set(selectedRows.map(r => r.spreadsheetId ?? null));
    const sharedSourceId = sourceIds.size === 1 ? [...sourceIds][0] : undefined;

    const sel = document.getElementById('move-destination');
    sel.innerHTML = '';
    sources.forEach(({ id, name }) => {
      if (sharedSourceId !== undefined && id === sharedSourceId) return;
      const opt = document.createElement('option');
      opt.value = id ?? '';
      opt.textContent = name;
      sel.appendChild(opt);
    });

    document.getElementById('move-status').style.display = 'none';
    document.getElementById('move-status').textContent = '';
    document.getElementById('move-log').style.display = 'none';
    document.getElementById('move-log').innerHTML = '';
    document.getElementById('move-error').style.display = 'none';
    document.getElementById('move-error').textContent = '';
    document.getElementById('btn-move-confirm').disabled = false;
    document.getElementById('btn-move-cancel').disabled = false;
    document.getElementById('btn-move-cancel').textContent = 'Cancel';
    document.getElementById('move-overlay').style.display = 'flex';
  }

  /**
   * Hides the move overlay.
   */
  function closeMoveOverlay() {
    document.getElementById('move-overlay').style.display = 'none';
  }

  /**
   * Collects selected rows, calls movePersonnel on the server, then updates
   * the local schema and re-renders the list.
   */
  function runMove() {
    const rowEntries = filteredRows
      .filter(r => selectedKeys.has(rowKey(r)))
      .map(r => ({ rowIndex: r.rowIndex, spreadsheetId: r.spreadsheetId ?? null }));

    if (!rowEntries.length) return;
    pendingMoveEntries = rowEntries;

    const rawDestId = document.getElementById('move-destination').value;
    const destinationSpreadsheetId = rawDestId === '' ? null : rawDestId;

    const statusEl = document.getElementById('move-status');
    statusEl.textContent = `Moving ${rowEntries.length} person${rowEntries.length !== 1 ? 's' : ''}…`;
    statusEl.style.display = 'block';
    document.getElementById('move-error').style.display = 'none';
    document.getElementById('btn-move-confirm').disabled = true;
    document.getElementById('btn-move-cancel').disabled = true;

    google.script.run
      .withSuccessHandler(onMoveSuccess)
      .withFailureHandler(onMoveError)
      .movePersonnel(rowEntries, destinationSpreadsheetId);
  }

  /**
   * Success handler for movePersonnel. Updates local schema, clears selection,
   * re-renders list, and shows per-person log.
   * @param {{
   *   log: Array<{name: string, folderNote: string}>,
   *   movedRows: Array<{rowIndex: number, values: string[], spreadsheetId?: string}>,
   *   skippedEntries: Array<{rowIndex: number, spreadsheetId: string|null}>
   * }} response
   */
  function onMoveSuccess(response) {
    // Entries the server actually skipped (same spreadsheet as destination, or source
    // inaccessible) were never deleted — exclude them so they aren't dropped from the
    // local cache and don't throw off the rowIndex shift below.
    const skippedKeys = new Set((response.skippedEntries ?? []).map(e => rowKey(e)));
    const movedEntries = pendingMoveEntries.filter(e => !skippedKeys.has(rowKey(e)));
    const movedKeys = new Set(movedEntries.map(e => rowKey(e)));
    schema.rows = schema.rows.filter(r => !movedKeys.has(rowKey(r)));
    movedKeys.forEach(k => selectedKeys.delete(k));

    // The server hard-deletes moved rows from their source sheet, shifting every
    // subsequent row's real sheet row number up by one per deletion. Decrement the
    // cached rowIndex of remaining same-source rows so later actions (edit/delete/
    // move) target the correct physical row instead of a stale one.
    adjustRowIndexesAfterDelete(groupRowIndexesBySource(movedEntries));
    pendingMoveEntries = null;

    (response.movedRows ?? []).forEach(r => schema.rows.push(r));
    applyFilters();

    const logEl = document.getElementById('move-log');
    logEl.innerHTML = '';
    (response.log ?? []).forEach(({ name, folderNote }) => {
      const div = document.createElement('div');
      div.textContent = `${name}: ${folderNote}`;
      logEl.appendChild(div);
    });
    logEl.style.display = 'block';

    const statusEl = document.getElementById('move-status');
    statusEl.textContent = 'Move complete.';
    document.getElementById('btn-move-confirm').disabled = true;
    document.getElementById('btn-move-cancel').disabled = false;
    document.getElementById('btn-move-cancel').textContent = 'Close';
  }

  /**
   * Failure handler for movePersonnel. Shows the error and re-enables buttons.
   * @param {Error} err
   */
  function onMoveError(err) {
    pendingMoveEntries = null;
    showError('move-error', 'Move failed', err);
    document.getElementById('move-status').style.display = 'none';
    document.getElementById('btn-move-confirm').disabled = false;
    document.getElementById('btn-move-cancel').disabled = false;
  }

  document.addEventListener('DOMContentLoaded', init);
</script>
