name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # shellcheck is preinstalled on GitHub's Ubuntu runners; shfmt is not.
      - run: sudo apt-get update && sudo apt-get install -y shfmt
      - run: npm ci
      - run: npm run check
